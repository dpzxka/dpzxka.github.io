<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="50%" style="stop-color:#1a1f3a"/>
      <stop offset="100%" style="stop-color:#0d1225"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b68ee"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e676"/>
      <stop offset="100%" style="stop-color:#69f0ae"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9800"/>
      <stop offset="100%" style="stop-color:#ffb74d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.08">
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="675" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="675" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="675" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="675" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="675" stroke="#00d4ff" stroke-width="0.5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="900" cy="180" r="120" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="900" cy="180" r="80" fill="none" stroke="#7b68ee" stroke-width="0.5" opacity="0.2"/>
  <circle cx="300" cy="500" r="100" fill="none" stroke="#00e676" stroke-width="0.5" opacity="0.1"/>

  <!-- Memory chip icon (left) -->
  <g transform="translate(150, 200)">
    <!-- Chip body -->
    <rect x="0" y="0" width="140" height="180" rx="8" fill="#1a2744" stroke="#00d4ff" stroke-width="1.5" opacity="0.9"/>
    <!-- Chip pins top -->
    <rect x="25" y="-12" width="8" height="14" fill="#00d4ff" opacity="0.7"/>
    <rect x="45" y="-12" width="8" height="14" fill="#00d4ff" opacity="0.7"/>
    <rect x="65" y="-12" width="8" height="14" fill="#00d4ff" opacity="0.7"/>
    <rect x="85" y="-12" width="8" height="14" fill="#00d4ff" opacity="0.7"/>
    <rect x="105" y="-12" width="8" height="14" fill="#00d4ff" opacity="0.7"/>
    <!-- Chip pins bottom -->
    <rect x="25" y="180" width="8" height="14" fill="#00d4ff" opacity="0.7"/>
    <rect x="45" y="180" width="8" height="14" fill="#00d4ff" opacity="0.7"/>
    <rect x="65" y="180" width="8" height="14" fill="#00d4ff" opacity="0.7"/>
    <rect x="85" y="180" width="8" height="14" fill="#00d4ff" opacity="0.7"/>
    <rect x="105" y="180" width="8" height="14" fill="#00d4ff" opacity="0.7"/>
    <!-- Chip pins left -->
    <rect x="-12" y="30" width="14" height="8" fill="#00d4ff" opacity="0.7"/>
    <rect x="-12" y="55" width="14" height="8" fill="#00d4ff" opacity="0.7"/>
    <rect x="-12" y="80" width="14" height="8" fill="#00d4ff" opacity="0.7"/>
    <rect x="-12" y="105" width="14" height="8" fill="#00d4ff" opacity="0.7"/>
    <rect x="-12" y="130" width="14" height="8" fill="#00d4ff" opacity="0.7"/>
    <!-- Chip pins right -->
    <rect x="140" y="30" width="14" height="8" fill="#00d4ff" opacity="0.7"/>
    <rect x="140" y="55" width="14" height="8" fill="#00d4ff" opacity="0.7"/>
    <rect x="140" y="80" width="14" height="8" fill="#00d4ff" opacity="0.7"/>
    <rect x="140" y="105" width="14" height="8" fill="#00d4ff" opacity="0.7"/>
    <rect x="140" y="130" width="14" height="8" fill="#00d4ff" opacity="0.7"/>
    <!-- Memory cells (Young/Old) -->
    <text x="70" y="35" text-anchor="middle" fill="#00d4ff" font-family="Arial, sans-serif" font-size="11" font-weight="bold">HEAP</text>
    <rect x="15" y="45" width="50" height="30" rx="3" fill="#00e676" opacity="0.3" stroke="#00e676" stroke-width="1"/>
    <text x="40" y="64" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="8">Young</text>
    <rect x="75" y="45" width="50" height="30" rx="3" fill="#7b68ee" opacity="0.3" stroke="#7b68ee" stroke-width="1"/>
    <text x="100" y="64" text-anchor="middle" fill="#7b68ee" font-family="Arial, sans-serif" font-size="8">Old</text>
    <!-- GC indicator -->
    <rect x="15" y="85" width="110" height="24" rx="3" fill="#ff5252" opacity="0.2" stroke="#ff5252" stroke-width="1"/>
    <text x="70" y="101" text-anchor="middle" fill="#ff5252" font-family="Arial, sans-serif" font-size="8">GC</text>
    <!-- Stats -->
    <text x="70" y="130" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" opacity="0.7">448MB</text>
    <text x="70" y="148" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" opacity="0.7">7 threads</text>
  </g>

  <!-- Battery icon (right) -->
  <g transform="translate(880, 140)">
    <!-- Battery body -->
    <rect x="0" y="10" width="120" height="55" rx="6" fill="none" stroke="#00e676" stroke-width="2" opacity="0.8"/>
    <!-- Battery terminal -->
    <rect x="120" y="28" width="8" height="18" rx="2" fill="#00e676" opacity="0.8"/>
    <!-- Battery level -->
    <rect x="4" y="14" width="80" height="47" rx="3" fill="#00e676" opacity="0.4"/>
    <!-- Lightning bolt -->
    <path d="M55 20 L48 38 L56 38 L50 58 L68 32 L58 32 L65 20 Z" fill="#ffd740" opacity="0.9"/>
    <!-- Battery text -->
    <text x="60" y="82" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="10" opacity="0.8">LOW POWER</text>
  </g>

  <!-- GC Timeline (center) -->
  <g transform="translate(380, 350)">
    <!-- Timeline axis -->
    <line x1="0" y1="60" x2="380" y2="60" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    <!-- Young GC bars -->
    <rect x="20" y="40" width="16" height="20" rx="2" fill="#00e676" opacity="0.7"/>
    <rect x="60" y="45" width="16" height="15" rx="2" fill="#00e676" opacity="0.7"/>
    <rect x="100" y="42" width="16" height="18" rx="2" fill="#00e676" opacity="0.7"/>
    <rect x="140" y="48" width="16" height="12" rx="2" fill="#00e676" opacity="0.7"/>
    <rect x="180" y="44" width="16" height="16" rx="2" fill="#00e676" opacity="0.7"/>
    <!-- Old GC bar -->
    <rect x="240" y="20" width="24" height="40" rx="2" fill="#7b68ee" opacity="0.7"/>
    <!-- Full GC bar -->
    <rect x="310" y="5" width="32" height="55" rx="2" fill="#ff5252" opacity="0.6"/>
    <!-- Labels -->
    <text x="28" y="76" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="8">YG</text>
    <text x="68" y="76" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="8">YG</text>
    <text x="108" y="76" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="8">YG</text>
    <text x="148" y="76" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="8">YG</text>
    <text x="188" y="76" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="8">YG</text>
    <text x="252" y="76" text-anchor="middle" fill="#7b68ee" font-family="Arial, sans-serif" font-size="8">OG</text>
    <text x="326" y="76" text-anchor="middle" fill="#ff5252" font-family="Arial, sans-serif" font-size="8">FG</text>
    <!-- Title -->
    <text x="190" y="-5" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" opacity="0.8">GC Timeline</text>
  </g>

  <!-- Background Task icons (bottom) -->
  <g transform="translate(380, 480)">
    <!-- Short task -->
    <rect x="0" y="0" width="80" height="50" rx="6" fill="#1a2744" stroke="#ff9800" stroke-width="1" opacity="0.8"/>
    <text x="40" y="20" text-anchor="middle" fill="#ff9800" font-family="Arial, sans-serif" font-size="8">SHORT</text>
    <text x="40" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" opacity="0.7">3min</text>

    <!-- Long task -->
    <rect x="100" y="0" width="80" height="50" rx="6" fill="#1a2744" stroke="#00e676" stroke-width="1" opacity="0.8"/>
    <text x="140" y="20" text-anchor="middle" fill="#00e676" font-family="Arial, sans-serif" font-size="8">LONG</text>
    <text x="140" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" opacity="0.7">持续</text>

    <!-- Delayed task -->
    <rect x="200" y="0" width="80" height="50" rx="6" fill="#1a2744" stroke="#00d4ff" stroke-width="1" opacity="0.8"/>
    <text x="240" y="20" text-anchor="middle" fill="#00d4ff" font-family="Arial, sans-serif" font-size="8">DELAYED</text>
    <text x="240" y="35" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" opacity="0.7">系统调度</text>

    <!-- Title -->
    <text x="140" y="-8" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" opacity="0.8">Background Tasks</text>
  </g>

  <!-- Main title -->
  <text x="600" y="100" text-anchor="middle" fill="url(#accent)" font-family="Arial, sans-serif" font-size="38" font-weight="bold" filter="url(#glow)">
    Memory &amp; Power
  </text>
  <text x="600" y="140" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" opacity="0.6">
    鸿蒙内存管理与功耗优化
  </text>

  <!-- Metrics panel -->
  <g transform="translate(700, 320)">
    <rect x="0" y="0" width="220" height="140" rx="8" fill="#1a2744" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
    <text x="110" y="22" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="11" font-weight="bold" opacity="0.8">KEY METRICS</text>
    <line x1="15" y1="30" x2="205" y2="30" stroke="#ffffff" stroke-width="0.3" opacity="0.3"/>

    <text x="20" y="52" fill="#00d4ff" font-family="Arial, sans-serif" font-size="10">HeapSize</text>
    <text x="200" y="52" text-anchor="end" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" opacity="0.8">448MB</text>

    <text x="20" y="72" fill="#00e676" font-family="Arial, sans-serif" font-size="10">GC Threshold</text>
    <text x="200" y="72" text-anchor="end" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" opacity="0.8">2-16MB</text>

    <text x="20" y="92" fill="#7b68ee" font-family="Arial, sans-serif" font-size="10">GC Threads</text>
    <text x="200" y="92" text-anchor="end" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" opacity="0.8">7</text>

    <text x="20" y="112" fill="#ff9800" font-family="Arial, sans-serif" font-size="10">Max Pause</text>
    <text x="200" y="112" text-anchor="end" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" opacity="0.8">40ms</text>

    <text x="20" y="132" fill="#ff5252" font-family="Arial, sans-serif" font-size="10">Worker Heap</text>
    <text x="200" y="132" text-anchor="end" fill="#ffffff" font-family="Arial, sans-serif" font-size="10" opacity="0.8">768MB</text>
  </g>

  <!-- Subtle particle dots -->
  <circle cx="50" cy="50" r="2" fill="#00d4ff" opacity="0.4"/>
  <circle cx="1150" cy="100" r="1.5" fill="#7b68ee" opacity="0.3"/>
  <circle cx="100" cy="600" r="2" fill="#00e676" opacity="0.3"/>
  <circle cx="1100" cy="550" r="1.5" fill="#ff9800" opacity="0.3"/>
  <circle cx="600" cy="650" r="2" fill="#00d4ff" opacity="0.2"/>
</svg>
