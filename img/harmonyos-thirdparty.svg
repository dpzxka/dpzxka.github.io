<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#1a1a4e"/>
      <stop offset="100%" stop-color="#0f1f3a"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,107,53,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,107,53,0.03)"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,180,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,180,255,0.03)"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,220,130,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,220,130,0.03)"/>
    </linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(180,100,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(180,100,255,0.03)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="700" cy="60" r="120" fill="none" stroke="rgba(255,107,53,0.06)" stroke-width="2"/>
  <circle cx="100" cy="440" r="80" fill="none" stroke="rgba(0,180,255,0.05)" stroke-width="2"/>

  <!-- Title -->
  <text x="400" y="65" fill="#ffffff" font-family="system-ui,sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="2">常用三方库</text>
  <text x="400" y="98" fill="rgba(255,255,255,0.5)" font-family="system-ui,sans-serif" font-size="16" text-anchor="middle" letter-spacing="4">HarmonyOS 生态集成指南</text>
  <line x1="250" y1="115" x2="550" y2="115" stroke="url(#grid)" stroke-width="2" opacity="0.5"/>

  <!-- Card 1 - 网络请求 -->
  <rect x="40" y="140" width="350" height="145" rx="16" fill="url(#card1)" stroke="rgba(255,107,53,0.25)" stroke-width="1"/>
  <text x="60" y="172" fill="#ff6b35" font-family="system-ui,sans-serif" font-size="14" font-weight="700">🌐 01 网络与数据交互</text>
  <text x="60" y="198" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">@ohos/axios - HTTP 请求（拦截器/取消）</text>
  <text x="60" y="220" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">@ohos/websocket - WebSocket 长连接</text>
  <text x="60" y="242" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">RCP - 官方网络框架</text>
  <text x="60" y="264" fill="rgba(255,255,255,0.45)" font-family="system-ui,sans-serif" font-size="11">安装量 100K+ / 月 · API 12+</text>

  <!-- Card 2 - UI -->
  <rect x="410" y="140" width="350" height="145" rx="16" fill="url(#card2)" stroke="rgba(0,180,255,0.25)" stroke-width="1"/>
  <text x="430" y="172" fill="#00b4ff" font-family="system-ui,sans-serif" font-size="14" font-weight="700">🎨 02 UI 组件与交互</text>
  <text x="430" y="198" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">TDesign - 腾讯企业级 UI 库</text>
  <text x="430" y="220" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">TuniaoUI - 轻量原生组件库</text>
  <text x="430" y="242" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">Lottie - 复杂动画渲染</text>
  <text x="430" y="264" fill="rgba(255,255,255,0.45)" font-family="system-ui,sans-serif" font-size="11">TDesign v0.8.5 · TuniaoUI 500+ Star</text>

  <!-- Card 3 - 存储 -->
  <rect x="40" y="305" width="350" height="145" rx="16" fill="url(#card3)" stroke="rgba(0,220,130,0.25)" stroke-width="1"/>
  <text x="60" y="337" fill="#00dc82" font-family="system-ui,sans-serif" font-size="14" font-weight="700">💾 03 数据持久化</text>
  <text x="60" y="363" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">@tencent/mmkv - 高性能 KV 存储</text>
  <text x="60" y="385" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">RelationalStore - 关系型数据库(SQLite)</text>
  <text x="60" y="407" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">Preferences - 轻量用户首选项</text>
  <text x="60" y="429" fill="rgba(255,255,255,0.45)" font-family="system-ui,sans-serif" font-size="11">MMKV 由腾讯 WeChat 团队维护</text>

  <!-- Card 4 - 工具 -->
  <rect x="410" y="305" width="350" height="145" rx="16" fill="url(#card4)" stroke="rgba(180,100,255,0.25)" stroke-width="1"/>
  <text x="430" y="337" fill="#b464ff" font-family="system-ui,sans-serif" font-size="14" font-weight="700">🧰 04 图片 / 多媒体 / 工具</text>
  <text x="430" y="363" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">imageglide - 图片加载与缓存</text>
  <text x="430" y="385" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">@ohos/zxing - 二维码扫码</text>
  <text x="430" y="407" fill="rgba(255,255,255,0.8)" font-family="system-ui,sans-serif" font-size="13">HarmonyOS SDK - 推送/支付/地图/登录</text>
  <text x="430" y="429" fill="rgba(255,255,255,0.45)" font-family="system-ui,sans-serif" font-size="11">官方 SDK 无需 ohpm 安装</text>

  <!-- Footer accent -->
  <rect x="300" y="478" width="200" height="2" rx="1" fill="url(#grid)" opacity="0.3"/>
</svg>
