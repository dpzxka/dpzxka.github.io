<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bgmd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d1e"/>
      <stop offset="100%" stop-color="#151530"/>
    </linearGradient>
    <filter id="shamd">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <marker id="arrowDep" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="rgba(255,255,255,0.2)"/>
    </marker>
  </defs>

  <rect width="800" height="420" rx="16" fill="url(#bgmd)"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">模块依赖关系图</text>

  <!-- Arrow key -->
  <g transform="translate(550, 20)">
    <line x1="0" y1="5" x2="18" y2="5" stroke="rgba(255,255,255,0.2)" stroke-width="1" marker-end="url(#arrowDep)"/>
    <text x="24" y="9" fill="rgba(255,255,255,0.2)" font-family="system-ui, sans-serif" font-size="8">依赖方向</text>
  </g>

  <!-- === Level 1: entry === -->
  <g filter="url(#shamd)">
    <rect x="300" y="48" width="200" height="44" rx="10" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.25)" stroke-width="1.2"/>
    <text x="400" y="68" text-anchor="middle" fill="#00d4ff" font-family="monospace, sans-serif" font-size="13" font-weight="600">entry</text>
    <text x="400" y="83" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="system-ui, sans-serif" font-size="9">壳工程 · 启动入口</text>
  </g>

  <!-- entry → feature arrows -->
  <line x1="330" y1="92" x2="200" y2="124" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" marker-end="url(#arrowDep)"/>
  <line x1="400" y1="92" x2="400" y2="124" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" marker-end="url(#arrowDep)"/>
  <line x1="470" y1="92" x2="600" y2="124" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" marker-end="url(#arrowDep)"/>

  <!-- === Level 2: feature === -->
  <g filter="url(#shamd)">
    <rect x="100" y="128" width="170" height="64" rx="8" fill="rgba(233,69,96,0.06)" stroke="rgba(233,69,96,0.15)" stroke-width="1"/>
    <text x="185" y="152" text-anchor="middle" fill="#ff8a9e" font-family="monospace, sans-serif" font-size="11" font-weight="600">feature-home</text>
    <text x="185" y="170" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="8">首页 · 推荐</text>

    <rect x="315" y="128" width="170" height="64" rx="8" fill="rgba(233,69,96,0.06)" stroke="rgba(233,69,96,0.15)" stroke-width="1"/>
    <text x="400" y="152" text-anchor="middle" fill="#ff8a9e" font-family="monospace, sans-serif" font-size="11" font-weight="600">feature-article</text>
    <text x="400" y="170" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="8">文章列表 · 详情</text>

    <rect x="530" y="128" width="170" height="64" rx="8" fill="rgba(233,69,96,0.06)" stroke="rgba(233,69,96,0.15)" stroke-width="1"/>
    <text x="615" y="152" text-anchor="middle" fill="#ff8a9e" font-family="monospace, sans-serif" font-size="11" font-weight="600">feature-xxx</text>
    <text x="615" y="170" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="8">更多业务模块</text>
  </g>

  <!-- feature → common + router arrows -->
  <line x1="185" y1="192" x2="185" y2="220" stroke="rgba(255,255,255,0.15)" stroke-width="1" marker-end="url(#arrowDep)"/>
  <line x1="400" y1="192" x2="400" y2="220" stroke="rgba(255,255,255,0.15)" stroke-width="1" marker-end="url(#arrowDep)"/>
  <line x1="615" y1="192" x2="615" y2="220" stroke="rgba(255,255,255,0.15)" stroke-width="1" marker-end="url(#arrowDep)"/>

  <!-- === Level 3: common + router (side by side) === -->
  <g filter="url(#shamd)">
    <rect x="80" y="224" width="300" height="52" rx="8" fill="rgba(75,192,192,0.06)" stroke="rgba(75,192,192,0.15)" stroke-width="1"/>
    <text x="230" y="248" text-anchor="middle" fill="#4bc0c0" font-family="monospace, sans-serif" font-size="12" font-weight="600">common/</text>
    <text x="230" y="265" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="9">common-ui · common-network · common-utils</text>
  </g>

  <g filter="url(#shamd)">
    <rect x="420" y="224" width="300" height="52" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.15)" stroke-width="1"/>
    <text x="570" y="248" text-anchor="middle" fill="#a855f7" font-family="monospace, sans-serif" font-size="12" font-weight="600">router/</text>
    <text x="570" y="265" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="9">Navigator · RoutePath · 拦截器</text>
  </g>

  <!-- common + router → shared -->
  <line x1="230" y1="276" x2="320" y2="306" stroke="rgba(255,255,255,0.15)" stroke-width="1" marker-end="url(#arrowDep)"/>
  <line x1="570" y1="276" x2="480" y2="306" stroke="rgba(255,255,255,0.15)" stroke-width="1" marker-end="url(#arrowDep)"/>

  <!-- === Level 4: shared === -->
  <g filter="url(#shamd)">
    <rect x="260" y="310" width="280" height="52" rx="10" fill="rgba(255,159,67,0.06)" stroke="rgba(255,159,67,0.15)" stroke-width="1.2"/>
    <text x="400" y="334" text-anchor="middle" fill="#ff9f43" font-family="monospace, sans-serif" font-size="13" font-weight="600">shared/ (hsp)</text>
    <text x="400" y="352" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="9">model · repository · theme · service</text>
  </g>

  <!-- Rules box -->
  <g transform="translate(80, 378)">
    <text x="0" y="0" fill="rgba(255,255,255,0.15)" font-family="system-ui, sans-serif" font-size="8">约束：feature 间不互相依赖 · router 不依赖 feature · 每个模块通过 index.ets 控制导出</text>
  </g>
</svg>
