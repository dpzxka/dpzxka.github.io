<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#121a2e"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34c759"/>
      <stop offset="100%" style="stop-color:#30d158"/>
    </linearGradient>
    <linearGradient id="chart1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#34c759;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#34c759;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="chart2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#007aff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#007aff;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#34c759" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#gridPattern)"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#34c759" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 40 80 L 40 40 L 80 40"/>
    <path d="M 1120 40 L 1160 40 L 1160 80"/>
    <path d="M 40 550 L 40 590 L 80 590"/>
    <path d="M 1120 590 L 1160 590 L 1160 550"/>
  </g>

  <!-- Performance chart: FPS bar chart -->
  <g transform="translate(700, 150)" filter="url(#shadow)">
    <!-- Chart background -->
    <rect x="0" y="0" width="320" height="200" rx="8" fill="#0d1520" opacity="0.8" stroke="#1e3a5f" stroke-width="0.5"/>

    <!-- Chart grid lines -->
    <g stroke="#1e3a5f" stroke-width="0.5" stroke-dasharray="4,4">
      <line x1="40" y1="40" x2="300" y2="40"/>
      <line x1="40" y1="80" x2="300" y2="80"/>
      <line x1="40" y1="120" x2="300" y2="120"/>
      <line x1="40" y1="160" x2="300" y2="160"/>
    </g>

    <!-- Y-axis labels -->
    <g fill="#8e8e93" font-size="10" font-family="monospace">
      <text x="30" y="44" text-anchor="end">60</text>
      <text x="30" y="84" text-anchor="end">45</text>
      <text x="30" y="124" text-anchor="end">30</text>
      <text x="30" y="164" text-anchor="end">15</text>
    </g>

    <!-- FPS bars (green = good, yellow = ok, red = bad) -->
    <rect x="50" y="50" width="24" height="110" fill="url(#chart1)" rx="2"/>
    <rect x="82" y="55" width="24" height="105" fill="url(#chart1)" rx="2"/>
    <rect x="114" y="48" width="24" height="112" fill="url(#chart1)" rx="2"/>
    <rect x="146" y="95" width="24" height="65" fill="url(#chart2)" rx="2"/>
    <rect x="178" y="50" width="24" height="110" fill="url(#chart1)" rx="2"/>
    <rect x="210" y="52" width="24" height="108" fill="url(#chart1)" rx="2"/>
    <rect x="242" y="58" width="24" height="102" fill="url(#chart1)" rx="2"/>
    <rect x="274" y="45" width="24" height="115" fill="url(#chart1)" rx="2"/>

    <!-- FPS line overlay -->
    <polyline points="62,55 94,60 126,53 158,100 190,55 222,57 254,63 286,50" fill="none" stroke="#34c759" stroke-width="2" filter="url(#glow)"/>

    <!-- 60fps target line -->
    <line x1="40" y1="50" x2="300" y2="50" stroke="#ff3b30" stroke-width="1" stroke-dasharray="6,3" opacity="0.6"/>
    <text x="305" y="54" fill="#ff3b30" font-size="9" font-family="monospace" opacity="0.8">60fps</text>

    <!-- Chart title -->
    <text x="170" y="25" fill="#fff" font-size="13" font-family="'SF Pro Display', sans-serif" font-weight="600" text-anchor="middle">Frame Rate Monitor</text>
  </g>

  <!-- Memory usage line chart -->
  <g transform="translate(700, 380)" filter="url(#shadow)">
    <rect x="0" y="0" width="320" height="160" rx="8" fill="#0d1520" opacity="0.8" stroke="#1e3a5f" stroke-width="0.5"/>

    <!-- Memory area chart -->
    <path d="M 40,120 L 80,110 120,105 160,95 200,90 240,85 280,80 300,75 L 300,140 L 40,140 Z" fill="url(#chart1)" opacity="0.4"/>
    <polyline points="40,120 80,110 120,105 160,95 200,90 240,85 280,80 300,75" fill="none" stroke="#34c759" stroke-width="2"/>

    <!-- Memory threshold line -->
    <line x1="40" y1="60" x2="300" y2="60" stroke="#ff9500" stroke-width="1" stroke-dasharray="6,3" opacity="0.6"/>
    <text x="305" y="64" fill="#ff9500" font-size="9" font-family="monospace" opacity="0.8">150MB</text>

    <!-- Y-axis labels -->
    <g fill="#8e8e93" font-size="10" font-family="monospace">
      <text x="30" y="64" text-anchor="end">150</text>
      <text x="30" y="104" text-anchor="end">100</text>
      <text x="30" y="144" text-anchor="end">50</text>
    </g>

    <text x="170" y="20" fill="#fff" font-size="13" font-family="'SF Pro Display', sans-serif" font-weight="600" text-anchor="middle">Memory Usage (MB)</text>
  </g>

  <!-- Startup time indicator -->
  <g transform="translate(80, 420)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#0d1520" opacity="0.8" stroke="#1e3a5f" stroke-width="0.5"/>
    <text x="90" y="25" fill="#8e8e93" font-size="11" font-family="monospace" text-anchor="middle">COLD START</text>
    <text x="90" y="60" fill="#34c759" font-size="36" font-family="'SF Pro Display', sans-serif" font-weight="700" text-anchor="middle" filter="url(#glow)">950</text>
    <text x="90" y="80" fill="#8e8e93" font-size="12" font-family="monospace" text-anchor="middle">ms</text>
  </g>

  <!-- CPU usage gauge -->
  <g transform="translate(300, 420)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#0d1520" opacity="0.8" stroke="#1e3a5f" stroke-width="0.5"/>
    <text x="90" y="25" fill="#8e8e93" font-size="11" font-family="monospace" text-anchor="middle">CPU IDLE</text>
    <text x="90" y="60" fill="#007aff" font-size="36" font-family="'SF Pro Display', sans-serif" font-weight="700" text-anchor="middle" filter="url(#glow)">5%</text>
    <text x="90" y="80" fill="#8e8e93" font-size="12" font-family="monospace" text-anchor="middle">usage</text>
  </g>

  <!-- Profiler icons (4 tools) -->
  <g transform="translate(80, 150)">
    <!-- Launch Profiler -->
    <g>
      <rect x="0" y="0" width="50" height="50" rx="8" fill="#0d1520" stroke="#34c759" stroke-width="1"/>
      <text x="25" y="32" fill="#34c759" font-size="22" font-family="monospace" text-anchor="middle">&#9654;</text>
      <text x="25" y="70" fill="#8e8e93" font-size="10" font-family="monospace" text-anchor="middle">Launch</text>
    </g>

    <!-- Frame Profiler -->
    <g transform="translate(70, 0)">
      <rect x="0" y="0" width="50" height="50" rx="8" fill="#0d1520" stroke="#007aff" stroke-width="1"/>
      <text x="25" y="32" fill="#007aff" font-size="22" font-family="monospace" text-anchor="middle">&#9650;</text>
      <text x="25" y="70" fill="#8e8e93" font-size="10" font-family="monospace" text-anchor="middle">Frame</text>
    </g>

    <!-- CPU Profiler -->
    <g transform="translate(140, 0)">
      <rect x="0" y="0" width="50" height="50" rx="8" fill="#0d1520" stroke="#ff3b30" stroke-width="1"/>
      <text x="25" y="32" fill="#ff3b30" font-size="22" font-family="monospace" text-anchor="middle">&#9679;</text>
      <text x="25" y="70" fill="#8e8e93" font-size="10" font-family="monospace" text-anchor="middle">CPU</text>
    </g>

    <!-- Memory Profiler -->
    <g transform="translate(210, 0)">
      <rect x="0" y="0" width="50" height="50" rx="8" fill="#0d1520" stroke="#ff9500" stroke-width="1"/>
      <text x="25" y="32" fill="#ff9500" font-size="22" font-family="monospace" text-anchor="middle">&#9632;</text>
      <text x="25" y="70" fill="#8e8e93" font-size="10" font-family="monospace" text-anchor="middle">Memory</text>
    </g>
  </g>

  <!-- Bottom info bar -->
  <g transform="translate(0, 560)">
    <rect width="1200" height="70" fill="#0a0e1a" opacity="0.8"/>
    <line x1="40" y1="0" x2="1160" y2="0" stroke="#1e3a5f" stroke-width="1"/>
  </g>

  <!-- Status indicators -->
  <g transform="translate(60, 588)">
    <circle cx="0" cy="0" r="4" fill="#34c759"/>
    <text x="12" y="4" fill="#34c759" font-size="12" font-family="monospace">OPTIMIZED</text>
  </g>

  <g transform="translate(200, 588)">
    <circle cx="0" cy="0" r="4" fill="#007aff"/>
    <text x="12" y="4" fill="#007aff" font-size="12" font-family="monospace">60 FPS</text>
  </g>

  <g transform="translate(320, 588)">
    <text x="0" y="4" fill="#8e8e93" font-size="12" font-family="monospace">TARGET: &lt;1200ms</text>
  </g>

  <!-- Title -->
  <g transform="translate(0, 0)">
    <text x="80" y="200" fill="#fff" font-size="48" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', sans-serif" font-weight="700" letter-spacing="2">
      Performance
    </text>
    <text x="80" y="240" fill="#34c759" font-size="42" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', sans-serif" font-weight="600" letter-spacing="1">
      Optimization
    </text>
    <text x="80" y="280" fill="#8e8e93" font-size="18" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', sans-serif" font-weight="400" letter-spacing="1">
      From Metrics to Tools
    </text>
  </g>

  <!-- Version badge -->
  <g transform="translate(80, 330)">
    <rect x="0" y="-8" width="90" height="28" rx="14" fill="none" stroke="#34c759" stroke-width="1"/>
    <text x="45" y="11" fill="#34c759" font-size="13" font-family="monospace" text-anchor="middle">HarmonyOS</text>
  </g>

  <!-- Tag chips -->
  <g transform="translate(190, 330)">
    <rect x="0" y="-8" width="70" height="28" rx="14" fill="none" stroke="#007aff" stroke-width="1"/>
    <text x="35" y="11" fill="#007aff" font-size="13" font-family="monospace" text-anchor="middle">DevEco</text>
  </g>

  <g transform="translate(275, 330)">
    <rect x="0" y="-8" width="80" height="28" rx="14" fill="none" stroke="#ff9500" stroke-width="1"/>
    <text x="40" y="11" fill="#ff9500" font-size="13" font-family="monospace" text-anchor="middle">Profiler</text>
  </g>

  <!-- Decorative particle dots -->
  <g fill="#34c759" opacity="0.15">
    <circle cx="1050" cy="120" r="2"/>
    <circle cx="1000" cy="180" r="1.5"/>
    <circle cx="1100" cy="350" r="1"/>
    <circle cx="500" cy="450" r="1.5"/>
    <circle cx="450" cy="100" r="1"/>
    <circle cx="550" cy="480" r="2"/>
    <circle cx="150" cy="450" r="1.5"/>
    <circle cx="400" cy="500" r="1"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="80" y="390" width="120" height="3" rx="1.5" fill="url(#accent)"/>
</svg>