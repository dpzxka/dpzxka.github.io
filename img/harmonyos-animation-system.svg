<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/><stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007aff"/><stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b6b"/><stop offset="100%" stop-color="#ffa94d"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>
  <text x="400" y="36" font-family="system-ui" font-size="22" fill="#e8edf5" text-anchor="middle" font-weight="700" filter="url(#shadow)">HarmonyOS 动画体系全景</text>
  <text x="400" y="56" font-family="system-ui" font-size="11" fill="#667799" text-anchor="middle">属性动画 · 显式动画 · 转场动画 · 路径动画 · 弹簧动画</text>

  <!-- Three pillars -->
  <!-- Column 1: 属性动画 -->
  <rect x="50" y="80" width="210" height="380" rx="12" fill="#1a1a3a" stroke="#007aff" stroke-width="1" opacity="0.6"/>
  <rect x="50" y="80" width="210" height="50" rx="12" fill="url(#g1)" opacity="0.8"/>
  <text x="155" y="110" font-family="system-ui" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">属性动画</text>
  <text x="155" y="126" font-family="system-ui" font-size="9" fill="#aabbdd" text-anchor="middle">animation API</text>

  <rect x="70" y="150" width="170" height="28" rx="6" fill="#1a2a3a" stroke="#2d7ff9" stroke-width="0.8"/>
  <text x="155" y="168" font-family="monospace" font-size="9" fill="#7ab4ff" text-anchor="middle">.animation({ duration: 300 })</text>
  <text x="155" y="210" font-family="system-ui" font-size="9" fill="#667799" text-anchor="middle">隐式动画</text>
  <text x="155" y="226" font-family="system-ui" font-size="9" fill="#667799" text-anchor="middle">属性变化自动驱动</text>
  <text x="155" y="242" font-family="system-ui" font-size="9" fill="#667799" text-anchor="middle">声明式绑定</text>

  <rect x="75" y="270" width="160" height="30" rx="4" fill="#1a2a3a" stroke="#3a5a7a" stroke-width="0.5"/>
  <text x="155" y="290" font-family="system-ui" font-size="9" fill="#aabbdd" text-anchor="middle">常用属性</text>
  <text x="155" y="320" font-family="system-ui" font-size="8" fill="#8899bb" text-anchor="middle">opacity / rotate / scale</text>
  <text x="155" y="338" font-family="system-ui" font-size="8" fill="#8899bb" text-anchor="middle">translate / width / height</text>
  <text x="155" y="356" font-family="system-ui" font-size="8" fill="#8899bb" text-anchor="middle">backgroundColor / border</text>

  <!-- Column 2: 显式动画 -->
  <rect x="295" y="80" width="210" height="380" rx="12" fill="#1a0a2a" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
  <rect x="295" y="80" width="210" height="50" rx="12" fill="url(#g2)" opacity="0.8"/>
  <text x="400" y="110" font-family="system-ui" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">显式动画</text>
  <text x="400" y="126" font-family="system-ui" font-size="9" fill="#aabbdd" text-anchor="middle">animateTo 函数</text>

  <rect x="315" y="150" width="170" height="28" rx="6" fill="#2a1a3a" stroke="#a855f7" stroke-width="0.8"/>
  <text x="400" y="168" font-family="monospace" font-size="9" fill="#c084fc" text-anchor="middle">animateTo({...}, () =&gt; { })</text>
  <text x="400" y="210" font-family="system-ui" font-size="9" fill="#667799" text-anchor="middle">显式控制动画范围</text>
  <text x="400" y="226" font-family="system-ui" font-size="9" fill="#667799" text-anchor="middle">闭包内状态变化驱动</text>
  <text x="400" y="242" font-family="system-ui" font-size="9" fill="#667799" text-anchor="middle">支持嵌套与组合</text>

  <rect x="320" y="270" width="160" height="30" rx="4" fill="#2a1a3a" stroke="#5a4a7a" stroke-width="0.5"/>
  <text x="400" y="290" font-family="system-ui" font-size="9" fill="#aabbdd" text-anchor="middle">适用场景</text>
  <text x="400" y="320" font-family="system-ui" font-size="8" fill="#8899bb" text-anchor="middle">批量属性同时动画</text>
  <text x="400" y="338" font-family="system-ui" font-size="8" fill="#8899bb" text-anchor="middle">嵌套动画需要精确控制</text>
  <text x="400" y="356" font-family="system-ui" font-size="8" fill="#8899bb" text-anchor="middle">配合转场动画使用</text>

  <!-- Column 3: 转场动画 -->
  <rect x="540" y="80" width="210" height="380" rx="12" fill="#2a0a0a" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
  <rect x="540" y="80" width="210" height="50" rx="12" fill="url(#g3)" opacity="0.8"/>
  <text x="645" y="110" font-family="system-ui" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">转场动画</text>
  <text x="645" y="126" font-family="system-ui" font-size="9" fill="#aabbdd" text-anchor="middle">TransitionEffect</text>

  <rect x="560" y="150" width="170" height="28" rx="6" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="0.8"/>
  <text x="645" y="168" font-family="monospace" font-size="9" fill="#f08080" text-anchor="middle">.transition(TE)</text>
  <text x="645" y="210" font-family="system-ui" font-size="9" fill="#667799" text-anchor="middle">组件出现/消失动画</text>
  <text x="645" y="226" font-family="system-ui" font-size="9" fill="#667799" text-anchor="middle">页面切换过渡</text>
  <text x="645" y="242" font-family="system-ui" font-size="9" fill="#667799" text-anchor="middle">自定义组合效果</text>

  <rect x="565" y="270" width="160" height="30" rx="4" fill="#3a1a1a" stroke="#5a3a3a" stroke-width="0.5"/>
  <text x="645" y="290" font-family="system-ui" font-size="9" fill="#aabbdd" text-anchor="middle">支持效果</text>
  <text x="645" y="320" font-family="system-ui" font-size="8" fill="#8899bb" text-anchor="middle">OPACITY / SLIDE / SCALE</text>
  <text x="645" y="338" font-family="system-ui" font-size="8" fill="#8899bb" text-anchor="middle">translate / rotate</text>
  <text x="645" y="356" font-family="system-ui" font-size="8" fill="#8899bb" text-anchor="middle">combine 组合多个效果</text>

  <!-- Bottom: Curve comparison mini chart -->
  <line x1="80" y1="400" x2="380" y2="400" stroke="#2a2f4a" stroke-width="1"/>
  <text x="80" y="418" font-family="system-ui" font-size="9" fill="#8899bb">动画曲线对比</text>

  <!-- Ease (blue) -->
  <path d="M 80 395 Q 130 420 180 420 Q 200 420 230 395 L 380 385" fill="none" stroke="#007aff" stroke-width="2"/>
  <text x="230" y="412" font-family="system-ui" font-size="8" fill="#007aff">ease-in-out</text>

  <!-- Spring (green) -->
  <path d="M 80 395 Q 100 390 110 370 Q 130 330 160 380 Q 180 405 200 395 L 380 385" fill="none" stroke="#00d4aa" stroke-width="2"/>
  <text x="110" y="365" font-family="system-ui" font-size="8" fill="#00d4aa">spring</text>

  <!-- Linear (purple) -->
  <path d="M 80 395 L 380 385" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="300" y="412" font-family="system-ui" font-size="8" fill="#a855f7">linear</text>

  <!-- Bottom icons row -->
  <text x="500" y="420" font-family="system-ui" font-size="9" fill="#8899bb">核心 API：</text>
  <text x="500" y="440" font-family="system-ui" font-size="8" fill="#667799">Curve / springCurve / stepsCurve / cubicBezier</text>
  <text x="500" y="458" font-family="system-ui" font-size="8" fill="#667799">AnimationOptions / animateTo / TransitionEffect</text>
</svg>
