<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b2ff7;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5521b5;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00cc66;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Decorative circuit lines -->
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
  <line x1="300" y1="0" x2="300" y2="630" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>
  <line x1="900" y1="0" x2="900" y2="630" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05"/>

  <!-- Left parent container (NodeController) -->
  <rect x="80" y="160" width="360" height="280" rx="16" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="80" y="160" width="360" height="280" rx="16" fill="#00d2ff" fill-opacity="0.05"/>
  
  <!-- Left container label -->
  <text x="260" y="195" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="13" font-weight="600" opacity="0.8">NodeContainer A</text>

  <!-- Left child nodes -->
  <rect x="110" y="215" width="300" height="40" rx="8" fill="#00d2ff" fill-opacity="0.15" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="240" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="12" opacity="0.9">FrameNode[0]</text>

  <rect x="110" y="270" width="300" height="40" rx="8" fill="#00d2ff" fill-opacity="0.15" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="295" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="12" opacity="0.9">FrameNode[1]</text>

  <!-- Moving node (highlighted) -->
  <rect x="110" y="330" width="300" height="40" rx="8" fill="#00ff88" fill-opacity="0.2" stroke="#00ff88" stroke-width="2" stroke-opacity="0.6" filter="url(#glow)"/>
  <text x="260" y="355" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="12" font-weight="bold" opacity="1">FrameNode[2] moveTo()</text>

  <rect x="110" y="385" width="300" height="40" rx="8" fill="#00d2ff" fill-opacity="0.15" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.4"/>
  <text x="260" y="410" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="12" opacity="0.9">FrameNode[3]</text>

  <!-- Right parent container (target) -->
  <rect x="740" y="160" width="360" height="280" rx="16" fill="none" stroke="#7b2ff7" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="740" y="160" width="360" height="280" rx="16" fill="#7b2ff7" fill-opacity="0.05"/>

  <!-- Right container label -->
  <text x="920" y="195" text-anchor="middle" fill="#7b2ff7" font-family="monospace" font-size="13" font-weight="600" opacity="0.8">NodeContainer B</text>

  <!-- Right child nodes -->
  <rect x="770" y="215" width="300" height="40" rx="8" fill="#7b2ff7" fill-opacity="0.15" stroke="#7b2ff7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="920" y="240" text-anchor="middle" fill="#7b2ff7" font-family="monospace" font-size="12" opacity="0.9">FrameNode[X]</text>

  <rect x="770" y="270" width="300" height="40" rx="8" fill="#7b2ff7" fill-opacity="0.15" stroke="#7b2ff7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="920" y="295" text-anchor="middle" fill="#7b2ff7" font-family="monospace" font-size="12" opacity="0.9">FrameNode[Y]</text>

  <!-- Empty slot (target for moving node) -->
  <rect x="770" y="330" width="300" height="40" rx="8" fill="none" stroke="#00ff88" stroke-width="2" stroke-dasharray="8,4" stroke-opacity="0.5"/>
  <text x="920" y="355" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="12" opacity="0.7">appendChild()</text>

  <rect x="770" y="385" width="300" height="40" rx="8" fill="#7b2ff7" fill-opacity="0.15" stroke="#7b2ff7" stroke-width="1" stroke-opacity="0.4"/>
  <text x="920" y="410" text-anchor="middle" fill="#7b2ff7" font-family="monospace" font-size="12" opacity="0.9">FrameNode[Z]</text>

  <!-- Motion arrow from left to right -->
  <path d="M 420 350 C 520 310, 620 310, 720 350" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-opacity="0.7" filter="url(#glow)"/>
  <polygon points="720,350 700,340 705,355" fill="#00ff88" fill-opacity="0.8"/>
  
  <!-- Motion lines -->
  <path d="M 440 335 Q 500 300, 560 320" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M 450 365 Q 510 400, 570 380" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Center icons -->
  <!-- Node icon -->
  <circle cx="600" cy="280" r="28" fill="none" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow)"/>
  <circle cx="600" cy="280" r="6" fill="#00ff88" fill-opacity="0.6"/>
  <line x1="600" y1="274" x2="600" y2="255" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="600" cy="250" r="4" fill="#00ff88" fill-opacity="0.5"/>
  <line x1="600" y1="286" x2="600" y2="305" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="600" cy="310" r="4" fill="#00ff88" fill-opacity="0.5"/>
  <line x1="594" y1="280" x2="575" y2="280" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="570" cy="280" r="4" fill="#00ff88" fill-opacity="0.5"/>
  <line x1="606" y1="280" x2="625" y2="280" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="630" cy="280" r="4" fill="#00ff88" fill-opacity="0.5"/>

  <!-- Code icon (bottom left) -->
  <text x="160" y="510" font-family="monospace" font-size="36" fill="#00d2ff" fill-opacity="0.15" font-weight="bold">&lt;/&gt;</text>

  <!-- BuilderNode icon (bottom right) -->
  <text x="920" y="510" font-family="monospace" font-size="28" fill="#7b2ff7" fill-opacity="0.15" font-weight="bold">@Builder</text>

  <!-- Floating decorative nodes -->
  <circle cx="150" cy="120" r="4" fill="#00d2ff" fill-opacity="0.3"/>
  <circle cx="200" cy="90" r="3" fill="#7b2ff7" fill-opacity="0.2"/>
  <circle cx="1050" cy="110" r="4" fill="#7b2ff7" fill-opacity="0.3"/>
  <circle cx="1000" cy="80" r="3" fill="#00d2ff" fill-opacity="0.2"/>
  <circle cx="500" cy="100" r="2" fill="#00ff88" fill-opacity="0.2"/>
  <circle cx="700" cy="95" r="2" fill="#00ff88" fill-opacity="0.2"/>

  <!-- API version badge -->
  <rect x="1060" y="540" width="100" height="28" rx="14" fill="none" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1110" y="559" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="11" opacity="0.6">API 11+</text>

  <!-- Title area -->
  <rect x="80" y="480" width="800" height="1" fill="#ffffff" fill-opacity="0.1"/>

  <text x="80" y="530" fill="#ffffff" font-family="sans-serif" font-size="38" font-weight="700" letter-spacing="1">
    <tspan fill="#00d2ff">FrameNode</tspan>
    <tspan fill="#ffffff" fill-opacity="0.9">&amp; </tspan>
    <tspan fill="#7b2ff7">NodeController</tspan>
  </text>
  <text x="80" y="570" fill="#ffffff" font-family="sans-serif" font-size="18" fill-opacity="0.5" letter-spacing="0.5">Dynamic Node Manipulation in ArkUI</text>

  <!-- Subtitle -->
  <text x="80" y="600" fill="#ffffff" font-family="sans-serif" font-size="14" fill-opacity="0.35">鸿蒙高阶自定义UI · 第三篇</text>
</svg>