<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929"/>
      <stop offset="50%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#0a1929"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#007DFF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00B4D8;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="tabletGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FF9F1C;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="0" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="0" x2="800" y2="0" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="90" x2="800" y2="90" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="270" x2="800" y2="270" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="450" x2="800" y2="450" stroke="#007DFF" stroke-width="1"/>
  </g>

  <!-- Phone -->
  <g transform="translate(80, 80)" filter="url(#glow)">
    <rect x="0" y="0" width="70" height="140" rx="10" fill="#0d2137" stroke="#007DFF" stroke-width="2"/>
    <rect x="5" y="15" width="60" height="100" rx="3" fill="#007DFF" opacity="0.2"/>
    <!-- Content blocks -->
    <rect x="10" y="20" width="50" height="12" rx="2" fill="#007DFF" opacity="0.4"/>
    <rect x="10" y="36" width="50" height="8" rx="2" fill="#007DFF" opacity="0.2"/>
    <rect x="10" y="48" width="50" height="8" rx="2" fill="#007DFF" opacity="0.2"/>
    <rect x="10" y="60" width="50" height="8" rx="2" fill="#007DFF" opacity="0.2"/>
    <!-- Bottom nav -->
    <rect x="5" y="118" width="60" height="18" rx="2" fill="#007DFF" opacity="0.3"/>
    <circle cx="15" cy="127" r="3" fill="#007DFF" opacity="0.6"/>
    <circle cx="30" cy="127" r="3" fill="#007DFF" opacity="0.3"/>
    <circle cx="45" cy="127" r="3" fill="#007DFF" opacity="0.3"/>
    <circle cx="55" cy="127" r="3" fill="#007DFF" opacity="0.3"/>
    <text x="35" y="165" text-anchor="middle" font-family="Arial" font-size="12" fill="#007DFF">Phone</text>
  </g>

  <!-- Tablet -->
  <g transform="translate(280, 60)" filter="url(#glow)">
    <rect x="0" y="0" width="130" height="170" rx="10" fill="#0d2137" stroke="#A855F7" stroke-width="2"/>
    <rect x="5" y="15" width="120" height="140" rx="3" fill="#A855F7" opacity="0.2"/>
    <!-- Side nav -->
    <rect x="5" y="15" width="25" height="140" rx="2" fill="#A855F7" opacity="0.3"/>
    <rect x="8" y="25" width="19" height="8" rx="1" fill="#A855F7" opacity="0.5"/>
    <rect x="8" y="38" width="19" height="8" rx="1" fill="#A855F7" opacity="0.2"/>
    <rect x="8" y="51" width="19" height="8" rx="1" fill="#A855F7" opacity="0.2"/>
    <!-- Content grid -->
    <rect x="35" y="20" width="40" height="30" rx="3" fill="#A855F7" opacity="0.3"/>
    <rect x="80" y="20" width="40" height="30" rx="3" fill="#A855F7" opacity="0.3"/>
    <rect x="35" y="55" width="85" height="15" rx="2" fill="#A855F7" opacity="0.2"/>
    <rect x="35" y="75" width="85" height="15" rx="2" fill="#A855F7" opacity="0.2"/>
    <text x="65" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="#A855F7">Tablet</text>
  </g>

  <!-- Foldable -->
  <g transform="translate(530, 60)" filter="url(#glow)">
    <!-- Left half (folded) -->
    <rect x="0" y="0" width="60" height="170" rx="8" fill="#0d2137" stroke="#FF6B35" stroke-width="2"/>
    <rect x="5" y="15" width="50" height="140" rx="3" fill="#FF6B35" opacity="0.15"/>
    <!-- Right half (unfolded) -->
    <rect x="65" y="0" width="90" height="170" rx="8" fill="#0d2137" stroke="#FF6B35" stroke-width="2"/>
    <rect x="70" y="15" width="80" height="140" rx="3" fill="#FF6B35" opacity="0.2"/>
    <!-- Fold line -->
    <line x1="62" y1="0" x2="62" y2="170" stroke="#FF6B35" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Arrow showing unfold -->
    <path d="M 30 85 L 62 85" stroke="#FF6B35" stroke-width="2" fill="none" marker-end="url(#arrowOrange)"/>
    <!-- Content on expanded side -->
    <rect x="75" y="25" width="70" height="12" rx="2" fill="#FF6B35" opacity="0.4"/>
    <rect x="75" y="42" width="70" height="8" rx="2" fill="#FF6B35" opacity="0.2"/>
    <rect x="75" y="55" width="30" height="30" rx="3" fill="#FF6B35" opacity="0.25"/>
    <rect x="110" y="55" width="35" height="30" rx="3" fill="#FF6B35" opacity="0.25"/>
    <text x="75" y="195" text-anchor="middle" font-family="Arial" font-size="12" fill="#FF6B35">Foldable</text>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF6B35"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">
    手机 / 平板 / 折叠屏适配
  </text>
  <text x="400" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">
    三种设备 · 一套代码 · 响应式布局
  </text>

  <!-- Fold status indicators -->
  <g transform="translate(530, 280)">
    <rect x="0" y="0" width="50" height="24" rx="12" fill="#FF6B35" opacity="0.3"/>
    <text x="25" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#FF6B35">折叠</text>
    <text x="65" y="16" font-family="Arial" font-size="14" fill="#94A3B8">→</text>
    <rect x="80" y="0" width="50" height="24" rx="12" fill="#FF6B35" opacity="0.5"/>
    <text x="105" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#FF6B35">悬停</text>
    <text x="145" y="16" font-family="Arial" font-size="14" fill="#94A3B8">→</text>
    <rect x="160" y="0" width="50" height="24" rx="12" fill="#FF6B35" opacity="0.8"/>
    <text x="185" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#FFFFFF">展开</text>
  </g>

  <!-- Bottom decoration -->
  <rect x="0" y="445" width="800" height="5" fill="url(#phoneGrad)" opacity="0.3"/>
</svg>