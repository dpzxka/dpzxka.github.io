<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#44a08d"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- 装饰网格 -->
  <g opacity="0.1">
    <line x1="100" y1="0" x2="100" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#fff" stroke-width="1"/>
  </g>
  
  <!-- 左侧组件树图标 -->
  <g transform="translate(80, 120)">
    <!-- 根节点 -->
    <rect x="60" y="0" width="100" height="40" rx="8" fill="url(#accent)" opacity="0.9"/>
    <text x="110" y="25" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">@Component</text>
    
    <!-- 连接线 -->
    <line x1="80" y1="40" x2="80" y2="70" stroke="#4ecdc4" stroke-width="2"/>
    <line x1="140" y1="40" x2="140" y2="70" stroke="#4ecdc4" stroke-width="2"/>
    
    <!-- 子节点 -->
    <rect x="20" y="70" width="80" height="35" rx="6" fill="url(#blue)" opacity="0.85"/>
    <text x="60" y="92" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">@Builder</text>
    
    <rect x="120" y="70" width="80" height="35" rx="6" fill="url(#blue)" opacity="0.85"/>
    <text x="160" y="92" font-family="Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">@Prop</text>
    
    <!-- 叶子节点 -->
    <line x1="60" y1="105" x2="60" y2="130" stroke="#4ecdc4" stroke-width="2"/>
    <rect x="20" y="130" width="80" height="30" rx="6" fill="#533483" opacity="0.8"/>
    <text x="60" y="150" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Text</text>
    
    <line x1="160" y1="105" x2="160" y2="130" stroke="#4ecdc4" stroke-width="2"/>
    <rect x="120" y="130" width="80" height="30" rx="6" fill="#533483" opacity="0.8"/>
    <text x="160" y="150" font-family="Arial, sans-serif" font-size="11" fill="white" text-anchor="middle">Button</text>
  </g>
  
  <!-- 右侧代码片段 -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="280" height="200" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="20" y="30" font-family="'Courier New', monospace" font-size="13" fill="#7ee787">@Component</text>
    <text x="20" y="55" font-family="'Courier New', monospace" font-size="13" fill="#d2a8ff">struct</text>
    <text x="65" y="55" font-family="'Courier New', monospace" font-size="13" fill="#ff7b72">MyComponent</text>
    <text x="20" y="80" font-family="'Courier New', monospace" font-size="13" fill="#ffa657">@State</text>
    <text x="65" y="80" font-family="'Courier New', monospace" font-size="13" fill="#79c0ff">count:</text>
    <text x="115" y="80" font-family="'Courier New', monospace" font-size="13" fill="#7ee787">number</text>
    <text x="20" y="105" font-family="'Courier New', monospace" font-size="13" fill="#8b949e">build() {</text>
    <text x="35" y="130" font-family="'Courier New', monospace" font-size="13" fill="#d2a8ff">Column</text>
    <text x="85" y="130" font-family="'Courier New', monospace" font-size="13" fill="#8b949e">() {</text>
    <text x="50" y="155" font-family="'Courier New', monospace" font-size="13" fill="#d2a8ff">Text</text>
    <text x="85" y="155" font-family="'Courier New', monospace" font-size="13" fill="#8b949e">(</text>
    <text x="90" y="155" font-family="'Courier New', monospace" font-size="13" fill="#79c0ff">this.count</text>
    <text x="175" y="155" font-family="'Courier New', monospace" font-size="13" fill="#8b949e">)</text>
    <text x="35" y="180" font-family="'Courier New', monospace" font-size="13" fill="#8b949e">}</text>
    <text x="20" y="200" font-family="'Courier New', monospace" font-size="13" fill="#8b949e">}</text>
  </g>
  
  <!-- 标题文字 -->
  <text x="400" y="340" font-family="Arial, sans-serif" font-size="28" fill="white" text-anchor="middle" font-weight="bold">高阶自定义UI：组件与Builder模式</text>
  <text x="400" y="375" font-family="Arial, sans-serif" font-size="16" fill="#8b949e" text-anchor="middle">HarmonyOS Advanced Custom UI</text>
  
  <!-- 装饰元素 -->
  <circle cx="50" cy="50" r="30" fill="#4ecdc4" opacity="0.2"/>
  <circle cx="750" cy="350" r="40" fill="#e94560" opacity="0.2"/>
  <circle cx="700" cy="80" r="25" fill="#533483" opacity="0.3"/>
</svg>