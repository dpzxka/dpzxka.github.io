<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1923"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="box1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <linearGradient id="box2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26c6da"/>
      <stop offset="100%" stop-color="#0097a7"/>
    </linearGradient>
    <linearGradient id="box3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    <linearGradient id="box4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </linearGradient>
    <linearGradient id="box5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ab47bc"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="50" x2="800" y2="50" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="800" y2="350" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Floating modules (boxes) -->

  <!-- Center: Core module -->
  <rect x="300" y="150" width="200" height="60" rx="8" fill="url(#box1)" filter="url(#glow)"/>
  <text x="400" y="186" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18" font-weight="bold">core</text>

  <!-- Top-left -->
  <rect x="50" y="50" width="160" height="50" rx="6" fill="url(#box2)"/>
  <text x="130" y="80" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13">feature-home</text>

  <!-- Top-right -->
  <rect x="590" y="50" width="160" height="50" rx="6" fill="url(#box2)"/>
  <text x="670" y="80" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13">feature-mine</text>

  <!-- Middle-left -->
  <rect x="50" y="140" width="160" height="50" rx="6" fill="url(#box2)"/>
  <text x="130" y="170" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13">feature-login</text>

  <!-- Middle-right -->
  <rect x="590" y="140" width="160" height="50" rx="6" fill="url(#box2)"/>
  <text x="670" y="170" text-anchor="middle" fill="white" font-family="sans-serif" font-size="13">feature-shop</text>

  <!-- Bottom tier: common modules -->
  <rect x="50" y="260" width="130" height="45" rx="6" fill="url(#box3)"/>
  <text x="115" y="287" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">common-network</text>

  <rect x="210" y="260" width="130" height="45" rx="6" fill="url(#box3)"/>
  <text x="275" y="287" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">common-storage</text>

  <rect x="460" y="260" width="130" height="45" rx="6" fill="url(#box3)"/>
  <text x="525" y="287" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">common-ui</text>

  <rect x="620" y="260" width="130" height="45" rx="6" fill="url(#box4)"/>
  <text x="685" y="287" text-anchor="middle" fill="white" font-family="sans-serif" font-size="12">common-utils</text>

  <!-- Lines: business modules → core -->
  <line x1="210" y1="75" x2="300" y2="170" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="590" y1="75" x2="500" y2="170" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="210" y1="165" x2="300" y2="180" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>
  <line x1="590" y1="165" x2="500" y2="180" stroke="#4fc3f7" stroke-width="1.5" opacity="0.5"/>

  <!-- Lines: core → common modules -->
  <line x1="350" y1="210" x2="115" y2="260" stroke="#66bb6a" stroke-width="1.5" opacity="0.4"/>
  <line x1="380" y1="210" x2="275" y2="260" stroke="#66bb6a" stroke-width="1.5" opacity="0.4"/>
  <line x1="420" y1="210" x2="525" y2="260" stroke="#66bb6a" stroke-width="1.5" opacity="0.4"/>
  <line x1="450" y1="210" x2="685" y2="260" stroke="#ffa726" stroke-width="1.5" opacity="0.4"/>

  <!-- Dotted lines between business modules -->
  <line x1="210" y1="120" x2="590" y2="120" stroke="white" stroke-width="1" stroke-dasharray="5,5" opacity="0.15"/>

  <!-- Title overlay -->
  <rect x="280" y="330" width="240" height="40" rx="20" fill="rgba(79,195,247,0.15)" stroke="#4fc3f7" stroke-width="1"/>
  <text x="400" y="356" text-anchor="middle" fill="#4fc3f7" font-family="sans-serif" font-size="16" font-weight="bold" filter="url(#glow)">新项目架构设计</text>
</svg>