<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="gradTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ffa94d"/>
    </linearGradient>
    <linearGradient id="gradMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
    <linearGradient id="gradBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5a7a"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#e8edf5" text-anchor="middle" filter="url(#glow)">HarmonyOS 生命周期三层体系</text>

  <!-- ========== LAYER 1: AbilityStage ========== -->
  <rect x="55" y="55" width="690" height="68" rx="10" fill="#2a1a1a" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
  <rect x="55" y="55" width="80" height="68" rx="10" fill="url(#gradTop)" opacity="0.9"/>
  <text x="95" y="92" font-family="system-ui" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" writing-mode="vertical-rl" letter-spacing="2">AbilityStage</text>

  <text x="150" y="75" font-family="system-ui" font-size="10" fill="#8899bb" font-weight="600">进程级 · 应用全局</text>
  <!-- lifecycle boxes -->
  <rect x="160" y="82" width="80" height="24" rx="12" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="200" y="98" font-family="monospace" font-size="9" fill="#f08080" text-anchor="middle">onCreate</text>

  <text x="255" y="98" font-family="system-ui" font-size="12" fill="#4a5a7a">→</text>

  <rect x="275" y="82" width="80" height="24" rx="12" fill="#3a2a1a" stroke="#ffa94d" stroke-width="1"/>
  <text x="315" y="98" font-family="monospace" font-size="9" fill="#f0b060" text-anchor="middle">onAcceptWant</text>

  <!-- ========== LAYER 2: UIAbility ========== -->
  <rect x="55" y="140" width="690" height="120" rx="10" fill="#1a1a2a" stroke="#007aff" stroke-width="1" opacity="0.6"/>
  <rect x="55" y="140" width="80" height="120" rx="10" fill="url(#gradMid)" opacity="0.9"/>
  <text x="95" y="205" font-family="system-ui" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" writing-mode="vertical-rl" letter-spacing="2">UIAbility</text>

  <text x="150" y="158" font-family="system-ui" font-size="10" fill="#8899bb" font-weight="600">Ability 生命周期（核心）</text>

  <!-- lifecycle flow -->
  <rect x="155" y="170" width="72" height="24" rx="12" fill="#1a2245" stroke="#2d7ff9" stroke-width="1"/>
  <text x="191" y="186" font-family="monospace" font-size="9" fill="#7ab4ff" text-anchor="middle">onCreate</text>
  <text x="237" y="186" font-family="system-ui" font-size="12" fill="#4a5a7a">→</text>

  <rect x="252" y="170" width="80" height="24" rx="12" fill="#1a2245" stroke="#2d7ff9" stroke-width="1"/>
  <text x="292" y="186" font-family="monospace" font-size="9" fill="#7ab4ff" text-anchor="middle">onWindowStage</text>
  <text x="345" y="186" font-family="system-ui" font-size="12" fill="#4a5a7a">→</text>

  <rect x="358" y="170" width="72" height="24" rx="12" fill="#1a3240" stroke="#00d4aa" stroke-width="1"/>
  <text x="394" y="186" font-family="monospace" font-size="9" fill="#5ddab0" text-anchor="middle">onForeground</text>
  <text x="443" y="186" font-family="system-ui" font-size="12" fill="#4a5a7a">→</text>

  <!-- Loop back -->
  <rect x="458" y="170" width="80" height="24" rx="12" fill="#3a2a20" stroke="#ffa94d" stroke-width="1"/>
  <text x="498" y="186" font-family="monospace" font-size="9" fill="#f0b060" text-anchor="middle">onBackground</text>

  <text x="550" y="186" font-family="system-ui" font-size="12" fill="#4a5a7a">↻</text>

  <rect x="565" y="170" width="72" height="24" rx="12" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="1"/>
  <text x="601" y="186" font-family="monospace" font-size="9" fill="#f08080" text-anchor="middle">onDestroy</text>

  <!-- Sub-text: WindowStage -->
  <rect x="155" y="212" width="120" height="20" rx="4" fill="#1a2a3a" stroke="#4a7a9a" stroke-width="0.5"/>
  <text x="215" y="225" font-family="system-ui" font-size="8" fill="#6a9abb">onWindowStageCreate</text>
  <text x="290" y="225" font-family="system-ui" font-size="10" fill="#4a5a7a">/</text>
  <rect x="305" y="212" width="120" height="20" rx="4" fill="#1a2a3a" stroke="#4a7a9a" stroke-width="0.5"/>
  <text x="365" y="225" font-family="system-ui" font-size="8" fill="#6a9abb">onWindowStageDestroy</text>

  <!-- ========== LAYER 3: ArkUI + NavDestination ========== -->
  <rect x="55" y="278" width="690" height="155" rx="10" fill="#1a102a" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
  <rect x="55" y="278" width="80" height="155" rx="10" fill="url(#gradBot)" opacity="0.9"/>
  <text x="95" y="360" font-family="system-ui" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" writing-mode="vertical-rl" letter-spacing="2">ArkUI</text>

  <text x="150" y="296" font-family="system-ui" font-size="10" fill="#8899bb" font-weight="600">UI 组件生命周期</text>

  <!-- Page life -->
  <text x="155" y="318" font-family="system-ui" font-size="9" fill="#aabbdd">Page 生命周期</text>
  <rect x="155" y="328" width="90" height="22" rx="4" fill="#2a1a3a" stroke="#a855f7" stroke-width="0.8"/>
  <text x="200" y="343" font-family="monospace" font-size="8" fill="#c084fc" text-anchor="middle">aboutToAppear</text>
  <text x="258" y="343" font-family="system-ui" font-size="10" fill="#4a5a7a">→</text>
  <rect x="272" y="328" width="60" height="22" rx="4" fill="#2a1a3a" stroke="#a855f7" stroke-width="0.8"/>
  <text x="302" y="343" font-family="monospace" font-size="8" fill="#c084fc" text-anchor="middle">build()</text>
  <text x="345" y="343" font-family="system-ui" font-size="10" fill="#4a5a7a">→</text>
  <rect x="358" y="328" width="80" height="22" rx="4" fill="#2a1a3a" stroke="#a855f7" stroke-width="0.8"/>
  <text x="398" y="343" font-family="monospace" font-size="8" fill="#c084fc" text-anchor="middle">onPageShow</text>
  <text x="452" y="343" font-family="system-ui" font-size="10" fill="#4a5a7a">⇄</text>
  <rect x="468" y="328" width="75" height="22" rx="4" fill="#2a1a3a" stroke="#a855f7" stroke-width="0.8"/>
  <text x="505" y="343" font-family="monospace" font-size="8" fill="#c084fc" text-anchor="middle">onPageHide</text>
  <text x="555" y="343" font-family="system-ui" font-size="10" fill="#4a5a7a">→</text>
  <rect x="570" y="328" width="95" height="22" rx="4" fill="#2a1a3a" stroke="#a855f7" stroke-width="0.8"/>
  <text x="617" y="343" font-family="monospace" font-size="8" fill="#c084fc" text-anchor="middle">aboutToDisappear</text>

  <!-- NavDestination life -->
  <text x="155" y="382" font-family="system-ui" font-size="9" fill="#aabbdd">NavDestination 生命周期</text>
  <text x="300" y="382" font-family="system-ui" font-size="9" fill="#667799">（已在独立文章中详解 → 6 个独有回调 + 4 个通用回调）</text>

  <rect x="155" y="394" width="65" height="22" rx="4" fill="#1a3040" stroke="#00d4aa" stroke-width="0.8"/>
  <text x="187" y="409" font-family="monospace" font-size="7" fill="#5ddab0" text-anchor="middle">onWillShow</text>
  <text x="230" y="409" font-family="system-ui" font-size="10" fill="#4a5a7a">→</text>
  <rect x="240" y="394" width="60" height="22" rx="4" fill="#1a3040" stroke="#00d4aa" stroke-width="0.8"/>
  <text x="270" y="409" font-family="monospace" font-size="7" fill="#5ddab0" text-anchor="middle">onShown</text>
  <text x="310" y="409" font-family="system-ui" font-size="10" fill="#4a5a7a">⇄</text>
  <rect x="325" y="394" width="65" height="22" rx="4" fill="#3a2a20" stroke="#ffa94d" stroke-width="0.8"/>
  <text x="357" y="409" font-family="monospace" font-size="7" fill="#f0b060" text-anchor="middle">onWillHide</text>
  <text x="400" y="409" font-family="system-ui" font-size="10" fill="#4a5a7a">→</text>
  <rect x="410" y="394" width="60" height="22" rx="4" fill="#3a2a20" stroke="#ffa94d" stroke-width="0.8"/>
  <text x="440" y="409" font-family="monospace" font-size="7" fill="#f0b060" text-anchor="middle">onHidden</text>
  <text x="480" y="409" font-family="system-ui" font-size="10" fill="#4a5a7a">→</text>
  <rect x="495" y="394" width="80" height="22" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="0.8"/>
  <text x="535" y="409" font-family="monospace" font-size="7" fill="#f08080" text-anchor="middle">onWillDisappear</text>
  <text x="585" y="409" font-family="system-ui" font-size="10" fill="#4a5a7a">→</text>
  <rect x="598" y="394" width="70" height="22" rx="4" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="0.8"/>
  <text x="633" y="409" font-family="monospace" font-size="7" fill="#f08080" text-anchor="middle">onDisappear</text>

  <!-- Vertical connecting arrows between layers -->
  <line x1="400" y1="123" x2="400" y2="138" stroke="#4a5a7a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <line x1="400" y1="260" x2="400" y2="276" stroke="#4a5a7a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>

  <!-- Flow labels -->
  <text x="408" y="132" font-family="system-ui" font-size="7" fill="#556688">AbilityStage → UIAbility</text>
  <text x="408" y="272" font-family="system-ui" font-size="7" fill="#556688">UIAbility → ArkUI</text>

  <!-- Bottom note -->
  <rect x="155" y="455" width="500" height="28" rx="6" fill="#1a1f3a" stroke="#2a2f4a" stroke-width="0.5"/>
  <text x="405" y="473" font-family="system-ui" font-size="9" fill="#667799" text-anchor="middle">UIAbility 是生命周期的主干，WindowStage 是窗口的舞台，ArkUI 是页面的载体，三层串联构成完整的应用体验</text>
</svg>
