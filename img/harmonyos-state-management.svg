<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="50%" stop-color="#0f0f2e"/>
      <stop offset="100%" stop-color="#16163e"/>
    </linearGradient>
    <linearGradient id="accentPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4bc0c0"/>
      <stop offset="100%" stop-color="#2ecc71"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <marker id="arrowPink" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e94560" opacity="0.6"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00d4ff" opacity="0.6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4bc0c0" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid dots -->
  <g opacity="0.04">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#ffffff"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Glow circles -->
  <circle cx="150" cy="150" r="180" fill="rgba(233,69,96,0.03)"/>
  <circle cx="1050" cy="500" r="200" fill="rgba(0,212,255,0.03)"/>
  <circle cx="600" cy="315" r="280" fill="rgba(75,192,192,0.02)"/>

  <!-- Title section -->
  <rect x="55" y="40" width="155" height="28" rx="14" fill="rgba(233,69,96,0.12)" stroke="#e94560" stroke-width="0.8"/>
  <text x="132" y="59" text-anchor="middle" fill="#e94560" font-family="system-ui, sans-serif" font-size="12" font-weight="600">HARMONYOS V2 · STATE</text>

  <text x="55" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="700">
    鸿蒙 V2 状态管理完全解析
  </text>
  <text x="55" y="155" fill="rgba(255,255,255,0.55)" font-family="system-ui, sans-serif" font-size="16">
    从 @Local 到 @Provider/@Consumer 的完整状态体系
  </text>

  <!-- ============ COMPONENT VISUALIZATION ============ -->

  <!-- App (Provider) - top level box -->
  <g filter="url(#shadow)">
    <rect x="360" y="190" width="785" height="380" rx="14" fill="rgba(0,212,255,0.04)" stroke="rgba(0,212,255,0.2)" stroke-width="1.2"/>
    <rect x="360" y="190" width="785" height="36" rx="14" fill="rgba(0,212,255,0.08)"/>
    <rect x="360" y="212" width="785" height="14" fill="rgba(0,212,255,0.08)"/>
    <text x="595" y="214" text-anchor="middle" fill="#00d4ff" font-family="monospace, sans-serif" font-size="13" font-weight="600">@Provider stats: { total, done }</text>

    <!-- Child A: TodoHeader -->
    <g filter="url(#shadow)">
      <rect x="385" y="248" width="340" height="285" rx="10" fill="rgba(233,69,96,0.04)" stroke="rgba(233,69,96,0.25)" stroke-width="1"/>
      <rect x="385" y="248" width="340" height="30" rx="10" fill="rgba(233,69,96,0.08)"/>
      <rect x="385" y="266" width="340" height="12" fill="rgba(233,69,96,0.08)"/>
      <text x="555" y="269" text-anchor="middle" fill="#ff8a9e" font-family="monospace, sans-serif" font-size="11" font-weight="600">TodoHeader</text>

      <!-- Consumer icon -->
      <rect x="400" y="292" width="120" height="22" rx="11" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.25)" stroke-width="0.8"/>
      <text x="460" y="307" text-anchor="middle" fill="#00d4ff" font-family="monospace, sans-serif" font-size="9" font-weight="600">@Consumer stats</text>

      <rect x="400" y="323" width="120" height="22" rx="11" fill="rgba(255,255,255,0.05)"/>
      <text x="460" y="338" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="monospace, sans-serif" font-size="9">@Local filter</text>

      <!-- Internal items -->
      <rect x="400" y="360" width="300" height="18" rx="4" fill="rgba(255,255,255,0.04)"/>
      <text x="550" y="373" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="monospace, sans-serif" font-size="9">待办事项 (已完成 3/8)</text>

      <rect x="400" y="388" width="140" height="30" rx="15" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.15)" stroke-width="0.8"/>
      <text x="470" y="407" text-anchor="middle" fill="rgba(0,212,255,0.5)" font-family="monospace, sans-serif" font-size="10">全部</text>

      <rect x="550" y="388" width="140" height="30" rx="15" fill="rgba(0,212,255,0.15)" stroke="rgba(0,212,255,0.25)" stroke-width="0.8"/>
      <text x="620" y="407" text-anchor="middle" fill="rgba(0,212,255,0.7)" font-family="monospace, sans-serif" font-size="10">未完成</text>
    </g>

    <!-- Arrow: Provider → Consumer -->
    <line x1="490" y1="238" x2="490" y2="280" stroke="rgba(0,212,255,0.4)" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <!-- Child B: TodoInput -->
    <g filter="url(#shadow)">
      <rect x="748" y="248" width="375" height="110" rx="10" fill="rgba(75,192,192,0.04)" stroke="rgba(75,192,192,0.25)" stroke-width="1"/>
      <rect x="748" y="248" width="375" height="30" rx="10" fill="rgba(75,192,192,0.08)"/>
      <rect x="748" y="266" width="375" height="12" fill="rgba(75,192,192,0.08)"/>
      <text x="935" y="269" text-anchor="middle" fill="#7ed6d6" font-family="monospace, sans-serif" font-size="11" font-weight="600">TodoInput</text>

      <rect x="763" y="292" width="120" height="22" rx="11" fill="rgba(255,255,255,0.05)"/>
      <text x="823" y="307" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="monospace, sans-serif" font-size="9">@Local text</text>

      <rect x="893" y="292" width="120" height="22" rx="11" fill="rgba(255,159,67,0.1)" stroke="rgba(255,159,67,0.25)" stroke-width="0.8"/>
      <text x="953" y="307" text-anchor="middle" fill="#ff9f43" font-family="monospace, sans-serif" font-size="9" font-weight="600">@Event onAdd</text>

      <rect x="763" y="324" width="340" height="22" rx="4" fill="rgba(255,255,255,0.04)"/>
      <text x="933" y="339" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="monospace, sans-serif" font-size="9">输入新的待办事项...  [添加]</text>
    </g>

    <!-- Child C: TodoItemView -->
    <g filter="url(#shadow)">
      <rect x="748" y="378" width="375" height="170" rx="10" fill="rgba(255,159,67,0.03)" stroke="rgba(255,159,67,0.2)" stroke-width="1"/>
      <rect x="748" y="378" width="375" height="30" rx="10" fill="rgba(255,159,67,0.07)"/>
      <rect x="748" y="396" width="375" height="12" fill="rgba(255,159,67,0.07)"/>
      <text x="935" y="397" text-anchor="middle" fill="#f0a070" font-family="monospace, sans-serif" font-size="11" font-weight="600">TodoItemView (LazyForEach)</text>

      <rect x="763" y="420" width="130" height="22" rx="11" fill="rgba(233,69,96,0.08)" stroke="rgba(233,69,96,0.18)" stroke-width="0.8"/>
      <text x="828" y="435" text-anchor="middle" fill="#e94560" font-family="monospace, sans-serif" font-size="9">@Param item</text>

      <rect x="903" y="420" width="100" height="22" rx="11" fill="rgba(75,192,192,0.08)" stroke="rgba(75,192,192,0.18)" stroke-width="0.8"/>
      <text x="953" y="435" text-anchor="middle" fill="#4bc0c0" font-family="monospace, sans-serif" font-size="9">Reusable</text>

      <!-- Item list -->
      <rect x="763" y="458" width="340" height="28" rx="4" fill="rgba(255,255,255,0.04)"/>
      <circle cx="778" cy="472" r="6" fill="rgba(75,192,192,0.4)"/>
      <text x="795" y="476" fill="rgba(255,255,255,0.5)" font-family="monospace, sans-serif" font-size="10">学习 @Track 装饰器</text>
      <text x="1068" y="476" text-anchor="end" fill="rgba(255,255,255,0.25)" font-family="monospace, sans-serif" font-size="9">✕</text>

      <rect x="763" y="492" width="340" height="28" rx="4" fill="rgba(255,255,255,0.04)"/>
      <circle cx="778" cy="506" r="6" fill="rgba(255,255,255,0.15)"/>
      <text x="795" y="510" fill="rgba(255,255,255,0.5)" font-family="monospace, sans-serif" font-size="10">理解 Provider/Consumer</text>
      <text x="1068" y="510" text-anchor="end" fill="rgba(255,255,255,0.25)" font-family="monospace, sans-serif" font-size="9">✕</text>
    </g>

    <!-- Connection arrows between children -->
    <line x1="725" y1="350" x2="748" y2="350" stroke="rgba(75,192,192,0.25)" stroke-width="1.5"/>
    <line x1="725" y1="400" x2="748" y2="400" stroke="rgba(75,192,192,0.25)" stroke-width="1.5"/>
  </g>

  <!-- Legend: decorator key -->
  <g transform="translate(55, 195)">
    <text x="0" y="0" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">装饰器速查</text>

    <rect x="0" y="12" width="240" height="28" rx="6" fill="rgba(0,212,255,0.06)"/>
    <circle cx="14" cy="26" r="4" fill="#00d4ff" opacity="0.6"/>
    <text x="28" y="30" fill="rgba(255,255,255,0.5)" font-family="monospace, sans-serif" font-size="10">@Provider → @Consumer</text>
    <text x="170" y="30" text-anchor="end" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="9">跨级共享</text>

    <rect x="0" y="46" width="240" height="28" rx="6" fill="rgba(233,69,96,0.06)"/>
    <circle cx="14" cy="60" r="4" fill="#e94560" opacity="0.6"/>
    <text x="28" y="64" fill="rgba(255,255,255,0.5)" font-family="monospace, sans-serif" font-size="10">@Param → @Event</text>
    <text x="170" y="64" text-anchor="end" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="9">父子通信</text>

    <rect x="0" y="80" width="240" height="28" rx="6" fill="rgba(255,255,255,0.03)"/>
    <circle cx="14" cy="94" r="4" fill="rgba(255,255,255,0.3)"/>
    <text x="28" y="98" fill="rgba(255,255,255,0.5)" font-family="monospace, sans-serif" font-size="10">@Local</text>
    <text x="170" y="98" text-anchor="end" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="9">内部状态</text>

    <rect x="0" y="114" width="240" height="28" rx="6" fill="rgba(75,192,192,0.06)"/>
    <circle cx="14" cy="128" r="4" fill="#4bc0c0" opacity="0.6"/>
    <text x="28" y="132" fill="rgba(255,255,255,0.5)" font-family="monospace, sans-serif" font-size="10">@Track</text>
    <text x="170" y="132" text-anchor="end" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="9">精确追踪</text>
  </g>

  <!-- Footer -->
  <rect x="55" y="580" width="60" height="3" rx="1.5" fill="url(#accentPink)"/>
  <text x="130" y="584" fill="rgba(255,255,255,0.2)" font-family="system-ui, sans-serif" font-size="12">鸿蒙 V2 组件开发系列 · 第 8 篇</text>
  <text x="1140" y="584" text-anchor="end" fill="rgba(255,255,255,0.2)" font-family="system-ui, sans-serif" font-size="11">下一篇: HMRouter</text>
</svg>
