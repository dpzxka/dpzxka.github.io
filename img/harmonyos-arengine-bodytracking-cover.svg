<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#1a0a1e"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="50%" style="stop-color:#ee5a24"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2a3a;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#141b2d;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="bone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ee5a24;stop-opacity:0.15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a29bfe" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="150" cy="550" r="180" fill="none" stroke="#ff6b6b" stroke-width="0.5" opacity="0.08"/>
  <circle cx="1050" cy="80" r="140" fill="none" stroke="#a29bfe" stroke-width="0.5" opacity="0.08"/>
  <circle cx="900" cy="520" r="90" fill="none" stroke="#ee5a24" stroke-width="0.5" opacity="0.06"/>

  <!-- Left: Phone with body tracking AR view -->
  <g transform="translate(250, 315)" filter="url(#shadow)">
    <!-- Phone frame -->
    <rect x="-125" y="-175" width="250" height="350" rx="22" fill="url(#card)" stroke="#2a3a4a" stroke-width="1.5"/>
    
    <!-- Camera view -->
    <g clip-path="url(#phoneClipBody)">
      <clipPath id="phoneClipBody">
        <rect x="-110" y="-160" width="220" height="320" rx="10"/>
      </clipPath>
      
      <rect x="-110" y="-160" width="220" height="320" fill="#0a0e1a"/>

      <!-- Camera grid overlay -->
      <g opacity="0.1">
        <line x1="-110" y1="-80" x2="110" y2="-80" stroke="#a29bfe" stroke-width="0.3"/>
        <line x1="-110" y1="0" x2="110" y2="0" stroke="#a29bfe" stroke-width="0.3"/>
        <line x1="-110" y1="80" x2="110" y2="80" stroke="#a29bfe" stroke-width="0.3"/>
        <line x1="0" y1="-160" x2="0" y2="160" stroke="#a29bfe" stroke-width="0.3"/>
      </g>

      <!-- Human silhouette -->
      <g transform="translate(0, -10)" opacity="0.12">
        <ellipse cx="0" cy="-60" rx="25" ry="30" fill="none" stroke="#fff" stroke-width="1"/>
        <line x1="0" y1="-30" x2="0" y2="40" stroke="#fff" stroke-width="1"/>
        <line x1="0" y1="-15" x2="-35" y2="20" stroke="#fff" stroke-width="1"/>
        <line x1="0" y1="-15" x2="35" y2="20" stroke="#fff" stroke-width="1"/>
        <line x1="0" y1="40" x2="-30" y2="85" stroke="#fff" stroke-width="1"/>
        <line x1="0" y1="40" x2="30" y2="85" stroke="#fff" stroke-width="1"/>
      </g>

      <!-- Skeleton overlay - red/blue keypoints and bones -->
      <g>
        <!-- Head -->
        <circle cx="0" cy="-65" r="5" fill="#ff6b6b" opacity="0.9"/>
        <!-- Neck -->
        <circle cx="0" cy="-35" r="4" fill="#ff6b6b" opacity="0.9"/>
        <!-- Line: head to neck -->
        <line x1="0" y1="-60" x2="0" y2="-35" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
        
        <!-- Shoulders -->
        <circle cx="-30" cy="-20" r="4" fill="#a29bfe" opacity="0.9"/>
        <circle cx="30" cy="-20" r="4" fill="#a29bfe" opacity="0.9"/>
        <line x1="-30" y1="-20" x2="30" y2="-20" stroke="#a29bfe" stroke-width="1.5" opacity="0.5"/>
        <line x1="0" y1="-35" x2="-30" y2="-20" stroke="#a29bfe" stroke-width="1.5" opacity="0.5"/>
        <line x1="0" y1="-35" x2="30" y2="-20" stroke="#a29bfe" stroke-width="1.5" opacity="0.5"/>

        <!-- Left arm -->
        <circle cx="-50" cy="5" r="4" fill="#ff6b6b" opacity="0.9"/>
        <circle cx="-60" cy="35" r="4" fill="#a29bfe" opacity="0.9"/>
        <line x1="-30" y1="-20" x2="-50" y2="5" stroke="#ff6b6b" stroke-width="1.5" opacity="0.6"/>
        <line x1="-50" y1="5" x2="-60" y2="35" stroke="#a29bfe" stroke-width="1.5" opacity="0.6"/>

        <!-- Right arm -->
        <circle cx="50" cy="5" r="4" fill="#ff6b6b" opacity="0.9"/>
        <circle cx="60" cy="35" r="4" fill="#a29bfe" opacity="0.9"/>
        <line x1="30" y1="-20" x2="50" y2="5" stroke="#ff6b6b" stroke-width="1.5" opacity="0.6"/>
        <line x1="50" y1="5" x2="60" y2="35" stroke="#a29bfe" stroke-width="1.5" opacity="0.6"/>

        <!-- Spine / Torso -->
        <circle cx="0" cy="0" r="4" fill="#ff6b6b" opacity="0.9"/>
        <line x1="0" y1="-35" x2="0" y2="0" stroke="#ff6b6b" stroke-width="2" opacity="0.7"/>
        
        <!-- Mid hip -->
        <circle cx="0" cy="35" r="4" fill="#a29bfe" opacity="0.9"/>
        <line x1="0" y1="0" x2="0" y2="35" stroke="#a29bfe" stroke-width="2" opacity="0.6"/>

        <!-- Hips -->
        <circle cx="-25" cy="35" r="4" fill="#ff6b6b" opacity="0.9"/>
        <circle cx="25" cy="35" r="4" fill="#ff6b6b" opacity="0.9"/>
        <line x1="-25" y1="35" x2="25" y2="35" stroke="#ff6b6b" stroke-width="1.5" opacity="0.5"/>
        <line x1="0" y1="35" x2="-25" y2="35" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>
        <line x1="0" y1="35" x2="25" y2="35" stroke="#ff6b6b" stroke-width="1" opacity="0.4"/>

        <!-- Left leg -->
        <circle cx="-20" cy="65" r="4" fill="#a29bfe" opacity="0.9"/>
        <circle cx="-15" cy="100" r="4" fill="#ff6b6b" opacity="0.9"/>
        <line x1="-25" y1="35" x2="-20" y2="65" stroke="#a29bfe" stroke-width="1.5" opacity="0.6"/>
        <line x1="-20" y1="65" x2="-15" y2="100" stroke="#ff6b6b" stroke-width="1.5" opacity="0.6"/>

        <!-- Right leg -->
        <circle cx="20" cy="65" r="4" fill="#a29bfe" opacity="0.9"/>
        <circle cx="15" cy="100" r="4" fill="#ff6b6b" opacity="0.9"/>
        <line x1="25" y1="35" x2="20" y2="65" stroke="#a29bfe" stroke-width="1.5" opacity="0.6"/>
        <line x1="20" y1="65" x2="15" y2="100" stroke="#ff6b6b" stroke-width="1.5" opacity="0.6"/>
      </g>

      <!-- Joint labels -->
      <g font-family="monospace" font-size="6" fill="#888">
        <text x="8" y="-62" fill="#ff6b6b">NOSE</text>
        <text x="8" y="-32" fill="#ff6b6b">NECK</text>
        <text x="-42" y="-22" fill="#a29bfe">R_S</text>
        <text x="32" y="-22" fill="#a29bfe">L_S</text>
        <text x="-68" y="38" fill="#a29bfe">R_W</text>
        <text x="62" y="38" fill="#a29bfe">L_W</text>
        <text x="-38" y="103" fill="#ff6b6b">R_A</text>
        <text x="18" y="103" fill="#ff6b6b">L_A</text>
      </g>
    </g>

    <!-- Phone notch -->
    <rect x="-25" y="-165" width="50" height="5" rx="2.5" fill="#0a0e1a"/>
  </g>

  <!-- Connection line to right panel -->
  <line x1="375" y1="315" x2="500" y2="250" stroke="#a29bfe" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <circle cx="438" cy="282" r="3" fill="#a29bfe" opacity="0.5"/>

  <!-- Right: Landmark data panel -->
  <g transform="translate(850, 315)" filter="url(#shadow)">
    <rect x="-140" y="-170" width="280" height="340" rx="12" fill="url(#card)" stroke="#2a3a4a" stroke-width="1"/>
    
    <text x="0" y="-145" text-anchor="middle" fill="#ff6b6b" font-family="sans-serif" font-size="13" font-weight="bold">ARBody Landmarks (20)</text>

    <!-- Landmark list -->
    <g transform="translate(0, -110)" font-family="monospace" font-size="7.5">
      <text x="-120" y="0" fill="#ff6b6b">01 NECK</text>
      <text x="0" y="0" fill="#a29bfe">11 LEFT_HIP</text>
      <text x="-120" y="14" fill="#a29bfe">02 RIGHT_SHOULDER</text>
      <text x="0" y="14" fill="#ee5a24">12 LEFT_KNEE</text>
      <text x="-120" y="28" fill="#ee5a24">03 RIGHT_ELBOW</text>
      <text x="0" y="28" fill="#a29bfe">13 LEFT_ANKLE</text>
      <text x="-120" y="42" fill="#a29bfe">04 RIGHT_WRIST</text>
      <text x="0" y="42" fill="#ff6b6b">14 MID_HIP</text>
      <text x="-120" y="56" fill="#ff6b6b">05 LEFT_SHOULDER</text>
      <text x="0" y="56" fill="#a29bfe">15 RIGHT_EAR</text>
      <text x="-120" y="70" fill="#a29bfe">06 LEFT_ELBOW</text>
      <text x="0" y="70" fill="#ee5a24">16 RIGHT_EYE</text>
      <text x="-120" y="84" fill="#ee5a24">07 LEFT_WRIST</text>
      <text x="0" y="84" fill="#ff6b6b">17 NOSE</text>
      <text x="-120" y="98" fill="#ff6b6b">08 RIGHT_HIP</text>
      <text x="0" y="98" fill="#a29bfe">18 LEFT_EYE</text>
      <text x="-120" y="112" fill="#a29bfe">09 RIGHT_KNEE</text>
      <text x="0" y="112" fill="#ee5a24">19 LEFT_EAR</text>
      <text x="-120" y="126" fill="#ee5a24">10 RIGHT_ANKLE</text>
      <text x="0" y="126" fill="#a29bfe">20 SPINE</text>
    </g>

    <!-- Code snippet at bottom -->
    <g transform="translate(0, 55)">
      <rect x="-120" y="-10" width="240" height="65" rx="4" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="0.5"/>
      <text x="-110" y="5" fill="#a29bfe" font-family="monospace" font-size="7">frame.acquireBodySkeleton()</text>
      <text x="-110" y="18" fill="#888" font-family="monospace" font-size="7">  → ARBody[]</text>
      <text x="-110" y="32" fill="#ff6b6b" font-family="monospace" font-size="7">body.getLandmarks2D()</text>
      <text x="-110" y="46" fill="#888" font-family="monospace" font-size="7">  → ARBodyLandmark2D[20]</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="36" font-weight="bold">人体骨骼点识别与跟踪</text>
  <text x="600" y="115" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="14">Human Body Skeleton Tracking</text>

  <!-- Subtitle area -->
  <rect x="280" y="520" width="640" height="65" rx="32" fill="url(#card)" stroke="#2a3a4a" stroke-width="1"/>
  <text x="600" y="548" text-anchor="middle" fill="#ccc" font-family="sans-serif" font-size="13">ARBody · ARBodyLandmark2D · acquireBodySkeleton</text>
  <text x="600" y="570" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="11">20 个骨骼关键点 · 2D 坐标追踪 · 姿态识别 · API 23+</text>

  <!-- Tech badges -->
  <g transform="translate(430, 135)">
    <rect x="0" y="0" width="90" height="20" rx="10" fill="#ff6b6b" opacity="0.15"/>
    <text x="45" y="14" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="9">ARType.BODY</text>
  </g>
  <g transform="translate(530, 135)">
    <rect x="0" y="0" width="100" height="20" rx="10" fill="#a29bfe" opacity="0.15"/>
    <text x="50" y="14" text-anchor="middle" fill="#a29bfe" font-family="monospace" font-size="9">API 23+</text>
  </g>
  <g transform="translate(640, 135)">
    <rect x="0" y="0" width="90" height="20" rx="10" fill="#ee5a24" opacity="0.15"/>
    <text x="45" y="14" text-anchor="middle" fill="#ee5a24" font-family="monospace" font-size="9">20 Landmarks</text>
  </g>

  <!-- Bottom line -->
  <line x1="200" y1="605" x2="1000" y2="605" stroke="#2a3a4a" stroke-width="0.5"/>
</svg>
