<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#132d46"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5276"/>
      <stop offset="100%" style="stop-color:#0d3b5e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4aa"/>
      <stop offset="100%" style="stop-color:#0099ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="0" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="675" stroke="#00d4aa" stroke-width="1"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#00d4aa" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#00d4aa" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#00d4aa" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00d4aa" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#00d4aa" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#00d4aa" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#00d4aa" stroke-width="1"/>
  </g>
  
  <!-- Device screens - PC/2in1 (left) -->
  <g transform="translate(80, 180)">
    <!-- Monitor frame -->
    <rect x="0" y="0" width="280" height="180" rx="8" fill="url(#screenGrad)" stroke="#1a5276" stroke-width="2"/>
    <!-- Window title bar -->
    <rect x="0" y="0" width="280" height="28" rx="8" fill="#1a3a5c"/>
    <rect x="0" y="20" width="280" height="8" fill="#1a3a5c"/>
    <circle cx="16" cy="14" r="5" fill="#ff5f57"/>
    <circle cx="36" cy="14" r="5" fill="#febc2e"/>
    <circle cx="56" cy="14" r="5" fill="#28c840"/>
    <text x="140" y="18" text-anchor="middle" fill="#8899aa" font-size="11">PC - Free Window</text>
    
    <!-- Split content -->
    <rect x="8" y="36" width="130" height="136" rx="4" fill="#0d2f4a" stroke="#1a5276" stroke-width="1"/>
    <rect x="16" y="48" width="100" height="8" rx="2" fill="#1a5276"/>
    <rect x="16" y="64" width="80" height="6" rx="2" fill="#1a5276"/>
    <rect x="16" y="80" width="90" height="6" rx="2" fill="#1a5276"/>
    <rect x="16" y="96" width="70" height="6" rx="2" fill="#1a5276"/>
    <rect x="16" y="116" width="100" height="40" rx="3" fill="#0a2a40"/>
    <text x="66" y="142" text-anchor="middle" fill="#4a8ab5" font-size="9">Nav Panel</text>
    
    <rect x="146" y="36" width="126" height="136" rx="4" fill="#0d2f4a" stroke="#1a5276" stroke-width="1"/>
    <rect x="154" y="48" width="80" height="8" rx="2" fill="#1a5276"/>
    <rect x="154" y="64" width="100" height="6" rx="2" fill="#1a5276"/>
    <rect x="154" y="80" width="90" height="6" rx="2" fill="#1a5276"/>
    <rect x="154" y="100" width="110" height="60" rx="3" fill="#0a2a40"/>
    <text x="209" y="136" text-anchor="middle" fill="#4a8ab5" font-size="9">Content</text>
    
    <!-- Monitor stand -->
    <rect x="120" y="180" width="40" height="20" fill="#0d3050"/>
    <rect x="100" y="200" width="80" height="8" rx="4" fill="#1a5276"/>
    
    <text x="140" y="230" text-anchor="middle" fill="#5a9ac5" font-size="13" font-weight="bold">PC / 2in1</text>
  </g>
  
  <!-- Device screens - Tablet (center) -->
  <g transform="translate(460, 140)">
    <!-- Tablet frame -->
    <rect x="0" y="0" width="260" height="200" rx="12" fill="url(#screenGrad)" stroke="#1a5276" stroke-width="2"/>
    <!-- Navigation bar -->
    <rect x="0" y="30" width="260" height="28" fill="#1a3a5c"/>
    <rect x="8" y="35" width="60" height="18" rx="4" fill="#00d4aa" opacity="0.3"/>
    <rect x="76" y="35" width="60" height="18" rx="4" fill="#1a5276"/>
    <rect x="144" y="35" width="60" height="18" rx="4" fill="#1a5276"/>
    <text x="130" y="48" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Split Mode</text>
    
    <!-- Left sidebar -->
    <rect x="8" y="66" width="100" height="126" rx="6" fill="#0d2f4a" stroke="#1a5276" stroke-width="1"/>
    <rect x="16" y="78" width="80" height="8" rx="2" fill="#1a5276"/>
    <rect x="16" y="94" width="60" height="6" rx="2" fill="#1a5276"/>
    <rect x="16" y="108" width="70" height="6" rx="2" fill="#1a5276"/>
    <rect x="16" y="128" width="80" height="50" rx="4" fill="#00d4aa" opacity="0.15"/>
    <text x="56" y="158" text-anchor="middle" fill="#00d4aa" font-size="9">Navigation</text>
    
    <!-- Right content -->
    <rect x="116" y="66" width="136" height="126" rx="6" fill="#0d2f4a" stroke="#1a5276" stroke-width="1"/>
    <rect x="124" y="78" width="100" height="8" rx="2" fill="#1a5276"/>
    <rect x="124" y="94" width="80" height="6" rx="2" fill="#1a5276"/>
    <rect x="124" y="110" width="120" height="68" rx="4" fill="#0a2a40"/>
    <text x="184" y="150" text-anchor="middle" fill="#4a8ab5" font-size="9">Page Content</text>
    
    <text x="130" y="228" text-anchor="middle" fill="#5a9ac5" font-size="13" font-weight="bold">Tablet</text>
  </g>
  
  <!-- Device screens - Car (right) -->
  <g transform="translate(790, 200)">
    <!-- Car screen (wider, shorter) -->
    <rect x="0" y="0" width="320" height="120" rx="8" fill="url(#screenGrad)" stroke="#1a5276" stroke-width="2"/>
    <!-- Full screen content -->
    <rect x="0" y="0" width="320" height="120" rx="8" fill="#0d2f4a"/>
    
    <!-- Car UI elements -->
    <rect x="16" y="16" width="100" height="88" rx="8" fill="#1a3a5c"/>
    <circle cx="66" cy="50" r="28" fill="#0a2a40" stroke="#00d4aa" stroke-width="2"/>
    <text x="66" y="55" text-anchor="middle" fill="#00d4aa" font-size="10">Navi</text>
    
    <rect x="130" y="16" width="80" height="40" rx="6" fill="#1a3a5c"/>
    <text x="170" y="40" text-anchor="middle" fill="#5a9ac5" font-size="10">Music</text>
    
    <rect x="220" y="16" width="84" height="40" rx="6" fill="#1a3a5c"/>
    <text x="262" y="40" text-anchor="middle" fill="#5a9ac5" font-size="10">Phone</text>
    
    <rect x="130" y="66" width="174" height="38" rx="6" fill="#1a3a5c"/>
    <text x="217" y="90" text-anchor="middle" fill="#5a9ac5" font-size="10">Climate Control</text>
    
    <text x="160" y="148" text-anchor="middle" fill="#5a9ac5" font-size="13" font-weight="bold">Car (Full Screen)</text>
  </g>
  
  <!-- Window mode icons -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="120" height="70" rx="8" fill="#0d2f4a" stroke="#00d4aa" stroke-width="1.5"/>
    <rect x="10" y="10" width="100" height="45" rx="4" fill="#1a3a5c"/>
    <text x="60" y="68" text-anchor="middle" fill="#00d4aa" font-size="10" font-weight="bold">Full Screen</text>
  </g>
  
  <g transform="translate(260, 420)">
    <rect x="0" y="0" width="120" height="70" rx="8" fill="#0d2f4a" stroke="#0099ff" stroke-width="1.5"/>
    <rect x="10" y="10" width="45" height="45" rx="4" fill="#1a3a5c"/>
    <rect x="60" y="10" width="50" height="45" rx="4" fill="#1a3a5c"/>
    <text x="60" y="68" text-anchor="middle" fill="#0099ff" font-size="10" font-weight="bold">Split</text>
  </g>
  
  <g transform="translate(420, 420)">
    <rect x="0" y="0" width="120" height="70" rx="8" fill="#0d2f4a" stroke="#ff6b9d" stroke-width="1.5"/>
    <rect x="20" y="8" width="80" height="48" rx="6" fill="#1a3a5c"/>
    <rect x="24" y="12" width="72" height="8" rx="2" fill="#ff6b9d" opacity="0.3"/>
    <text x="60" y="68" text-anchor="middle" fill="#ff6b9d" font-size="10" font-weight="bold">Floating</text>
  </g>
  
  <g transform="translate(580, 420)">
    <rect x="0" y="0" width="120" height="70" rx="8" fill="#0d2f4a" stroke="#ffd93d" stroke-width="1.5"/>
    <rect x="10" y="10" width="100" height="45" rx="4" fill="#1a3a5c"/>
    <rect x="14" y="14" width="92" height="6" rx="2" fill="#ffd93d" opacity="0.3"/>
    <text x="60" y="68" text-anchor="middle" fill="#ffd93d" font-size="10" font-weight="bold">Freeform</text>
  </g>
  
  <!-- Immersive layout diagram -->
  <g transform="translate(760, 420)">
    <rect x="0" y="0" width="180" height="70" rx="8" fill="#0d2f4a" stroke="#00d4aa" stroke-width="1.5"/>
    <rect x="10" y="8" width="160" height="52" rx="4" fill="#1a3a5c"/>
    <rect x="10" y="8" width="160" height="10" rx="4" fill="#ff5f57" opacity="0.4"/>
    <rect x="10" y="50" width="160" height="10" rx="4" fill="#ff5f57" opacity="0.4"/>
    <text x="90" y="38" text-anchor="middle" fill="#00d4aa" font-size="10">Immersive</text>
  </g>
  
  <!-- Connection arrows -->
  <g filter="url(#glow)">
    <line x1="380" y1="455" x2="440" y2="455" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="550" y1="455" x2="600" y2="455" stroke="#0099ff" stroke-width="2" marker-end="url(#arrowhead2)"/>
    <line x1="710" y1="455" x2="770" y2="455" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrowhead3)"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="68" text-anchor="middle" fill="#ffffff" font-size="36" font-weight="bold" font-family="Arial, sans-serif">
    <tspan fill="url(#accentGrad)">Large Screen</tspan>
    <tspan fill="#ffffff"> &amp; Car</tspan>
  </text>
  <text x="600" y="108" text-anchor="middle" fill="#7aafcc" font-size="18" font-family="Arial, sans-serif">
    Window Modes &amp; Multi-Tasking
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="620" text-anchor="middle" fill="#4a8ab5" font-size="14" font-family="Arial, sans-serif">
    Free Window | Split | Floating | Immersive | Car Kit | HiCar
  </text>
  
  <!-- HarmonyOS badge -->
  <rect x="480" y="630" width="240" height="28" rx="14" fill="#00d4aa" opacity="0.15" stroke="#00d4aa" stroke-width="1"/>
  <text x="600" y="650" text-anchor="middle" fill="#00d4aa" font-size="12" font-family="Arial, sans-serif" font-weight="bold">
    HarmonyOS NEXT
  </text>
</svg>