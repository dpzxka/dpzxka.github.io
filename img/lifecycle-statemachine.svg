<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a5a7a"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="url(#bg)" rx="8"/>
  <text x="380" y="28" font-family="system-ui" font-size="13" fill="#e8edf5" text-anchor="middle" font-weight="700">UIAbility 状态机 + WindowStage 生命周期</text>

  <!-- States as rounded boxes -->
  <!-- Create -->
  <rect x="90" y="60" width="120" height="50" rx="10" fill="#1a2245" stroke="#2d7ff9" stroke-width="2"/>
  <text x="150" y="80" font-family="system-ui" font-size="11" fill="#7ab4ff" text-anchor="middle" font-weight="600">CREATE</text>
  <text x="150" y="97" font-family="system-ui" font-size="8" fill="#556688" text-anchor="middle">应用首次启动</text>

  <line x1="210" y1="85" x2="250" y2="85" stroke="#4a5a7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="78" font-family="system-ui" font-size="8" fill="#556688" text-anchor="middle">onCreate</text>

  <!-- WindowStage Create -->
  <rect x="260" y="60" width="140" height="50" rx="10" fill="#1a2a3a" stroke="#4a7a9a" stroke-width="2" stroke-dasharray="6,2"/>
  <text x="330" y="80" font-family="system-ui" font-size="10" fill="#6a9abb" text-anchor="middle" font-weight="600">WindowStage</text>
  <text x="330" y="97" font-family="system-ui" font-size="8" fill="#556688" text-anchor="middle">加载首屏页面</text>

  <line x1="400" y1="85" x2="440" y2="85" stroke="#4a5a7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="78" font-family="system-ui" font-size="8" fill="#556688" text-anchor="middle">onForeground</text>

  <!-- Foreground -->
  <rect x="450" y="60" width="120" height="50" rx="10" fill="#1a3240" stroke="#00d4aa" stroke-width="2"/>
  <text x="510" y="80" font-family="system-ui" font-size="11" fill="#5ddab0" text-anchor="middle" font-weight="600">FOREGROUND</text>
  <text x="510" y="97" font-family="system-ui" font-size="8" fill="#556688" text-anchor="middle">应用可见可交互</text>

  <!-- Foreground to Background (down arrow) -->
  <line x1="510" y1="110" x2="510" y2="155" stroke="#4a5a7a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="522" y="136" font-family="system-ui" font-size="8" fill="#556688">onBackground</text>

  <!-- Background -->
  <rect x="450" y="160" width="120" height="50" rx="10" fill="#3a2a20" stroke="#ffa94d" stroke-width="2"/>
  <text x="510" y="180" font-family="system-ui" font-size="11" fill="#f0b060" text-anchor="middle" font-weight="600">BACKGROUND</text>
  <text x="510" y="197" font-family="system-ui" font-size="8" fill="#556688" text-anchor="middle">应用不可见</text>

  <!-- Background back to Foreground (up arrow) -->
  <line x1="570" y1="175" x2="610" y2="105" stroke="#5ddab0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="618" y="145" font-family="system-ui" font-size="8" fill="#5ddab0">onForeground</text>

  <!-- Background to WindowStage Destroy -->
  <line x1="510" y1="210" x2="510" y2="240" stroke="#4a5a7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- WindowStage Destroy -->
  <rect x="450" y="245" width="120" height="40" rx="10" fill="#2a1a1a" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="6,2"/>
  <text x="510" y="260" font-family="system-ui" font-size="9" fill="#f08080" text-anchor="middle">WindowStage 销毁</text>
  <text x="510" y="275" font-family="system-ui" font-size="7" fill="#556688" text-anchor="middle">onWindowStageDestroy</text>

  <line x1="510" y1="285" x2="510" y2="300" stroke="#4a5a7a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Destroy -->
  <rect x="450" y="305" width="120" height="30" rx="10" fill="#3a1a1a" stroke="#ff6b6b" stroke-width="2"/>
  <text x="510" y="323" font-family="system-ui" font-size="11" fill="#f08080" text-anchor="middle" font-weight="600">DESTROY</text>

  <!-- Key notes on the right -->
  <text x="110" y="155" font-family="system-ui" font-size="10" fill="#8899bb" font-weight="600">关键说明：</text>
  <text x="110" y="178" font-family="system-ui" font-size="9" fill="#667799">• onCreate / onDestroy 只执行一次</text>
  <text x="110" y="198" font-family="system-ui" font-size="9" fill="#667799">• onForeground / onBackground 可反复切换</text>
  <text x="110" y="218" font-family="system-ui" font-size="9" fill="#667799">• WindowStage 的生命周期嵌套在 UIAbility 中</text>
  <text x="110" y="238" font-family="system-ui" font-size="9" fill="#667799">• 应用在后台可能被系统销毁，不走完整销毁链路</text>
  <text x="110" y="258" font-family="system-ui" font-size="9" fill="#667799">• onWindowStageCreate 中调用 loadContent 启动 ArkUI</text>

  <!-- Cyclic arrow symbol -->
  <line x1="390" y1="185" x2="320" y2="185" stroke="#ffa94d" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="340" y="200" font-family="system-ui" font-size="8" fill="#f0b060" text-anchor="middle">系统回收</text>
</svg>
