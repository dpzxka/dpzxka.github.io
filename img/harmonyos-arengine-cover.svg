<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="50%" style="stop-color:#1b2838"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007aff"/>
      <stop offset="100%" style="stop-color:#5856d6"/>
    </linearGradient>
    <linearGradient id="grid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.08">
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#4a9eff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#gridPattern)"/>
  </g>

  <!-- Scan lines effect -->
  <g opacity="0.03">
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#fff" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#scan)"/>
  </g>

  <!-- 3D interface elements -->
  <!-- Corner brackets -->
  <g stroke="#007aff" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 40 80 L 40 40 L 80 40"/>
    <path d="M 1120 40 L 1160 40 L 1160 80"/>
    <path d="M 40 550 L 40 590 L 80 590"/>
    <path d="M 1120 590 L 1160 590 L 1160 550"/>
  </g>

  <!-- AR camera viewfinder ring -->
  <g transform="translate(850, 260)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.3"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#accent)" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Crosshair -->
  <g transform="translate(850, 260)" filter="url(#glow)">
    <line x1="-40" y1="0" x2="-12" y2="0" stroke="#00e5ff" stroke-width="2"/>
    <line x1="12" y1="0" x2="40" y2="0" stroke="#00e5ff" stroke-width="2"/>
    <line x1="0" y1="-40" x2="0" y2="-12" stroke="#00e5ff" stroke-width="2"/>
    <line x1="0" y1="12" x2="0" y2="40" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#00e5ff"/>
  </g>

  <!-- Hit-test result point -->
  <g transform="translate(820, 230)" opacity="0.7">
    <circle cx="0" cy="0" r="6" fill="#7ed321" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#7ed321" stroke-width="1" opacity="0.5"/>
    <line x1="6" y1="6" x2="20" y2="20" stroke="#7ed321" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Detected plane wireframe -->
  <g transform="translate(750, 350)" opacity="0.5">
    <polygon points="0,-40 60,-20 70,30 10,20 -30,10" fill="none" stroke="#4a9eff" stroke-width="1.5"/>
    <polygon points="10,-30 50,-15 55,20 15,15 -20,8" fill="none" stroke="#4a9eff" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Second plane (wall) -->
  <g transform="translate(920, 200)" opacity="0.35">
    <polygon points="0,-30 40,-25 45,15 5,10" fill="none" stroke="#5856d6" stroke-width="1"/>
  </g>

  <!-- Semantic label on plane -->
  <g transform="translate(755, 360)">
    <rect x="-2" y="-10" width="42" height="16" rx="3" fill="#007aff" opacity="0.8"/>
    <text x="19" y="2" fill="#fff" font-size="9" font-family="monospace" text-anchor="middle">FLOOR</text>
  </g>

  <!-- 3D floating cube -->
  <g transform="translate(680, 180)" filter="url(#shadow)">
    <polygon points="0,0 35,-15 60,0 25,15" fill="#007aff" opacity="0.6"/>
    <polygon points="0,0 25,15 25,50 0,35" fill="#0066cc" opacity="0.5"/>
    <polygon points="60,0 60,35 25,50 25,15" fill="#5ac8fa" opacity="0.4"/>
    <line x1="0" y1="0" x2="60" y2="0" stroke="#5ac8fa" stroke-width="0.5"/>
    <line x1="0" y1="0" x2="0" y2="35" stroke="#5ac8fa" stroke-width="0.5"/>
  </g>

  <!-- Floating sphere (second 3D object) -->
  <g transform="translate(950, 380)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="22" fill="url(#accent)" opacity="0.5"/>
    <ellipse cx="-6" cy="-6" rx="8" ry="6" fill="#fff" opacity="0.15"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Bottom info bar -->
  <g transform="translate(0, 560)">
    <rect width="1200" height="70" fill="#0a1420" opacity="0.8"/>
    <line x1="40" y1="0" x2="1160" y2="0" stroke="#1e3a5f" stroke-width="1"/>
  </g>

  <!-- Status indicators -->
  <g transform="translate(60, 588)">
    <circle cx="0" cy="0" r="4" fill="#4cd964"/>
    <text x="12" y="4" fill="#4cd964" font-size="12" font-family="monospace">TRACKING</text>
  </g>

  <g transform="translate(200, 588)">
    <circle cx="0" cy="0" r="4" fill="#5ac8fa"/>
    <text x="12" y="4" fill="#5ac8fa" font-size="12" font-family="monospace">PLANES: 4</text>
  </g>

  <g transform="translate(340, 588)">
    <text x="0" y="4" fill="#8e8e93" font-size="12" font-family="monospace">LIGHT: 0.72</text>
  </g>

  <!-- Title -->
  <g transform="translate(0, 0)">
    <text x="80" y="200" fill="#fff" font-size="48" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', sans-serif" font-weight="700" letter-spacing="2">
      AR Engine
    </text>
    <text x="80" y="235" fill="#5ac8fa" font-size="42" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', sans-serif" font-weight="600" letter-spacing="1">
      完全指南
    </text>
    <text x="80" y="280" fill="#8e8e93" font-size="18" font-family="'SF Pro Display', 'Segoe UI', 'Helvetica Neue', sans-serif" font-weight="400" letter-spacing="1">
      从会话管理 · 平面检测 · 到模型渲染
    </text>
  </g>

  <!-- Version badge -->
  <g transform="translate(80, 330)">
    <rect x="0" y="-8" width="90" height="28" rx="14" fill="none" stroke="#007aff" stroke-width="1"/>
    <text x="45" y="11" fill="#007aff" font-size="13" font-family="monospace" text-anchor="middle">HarmonyOS V2</text>
  </g>

  <!-- Tag chips -->
  <g transform="translate(190, 330)">
    <rect x="0" y="-8" width="70" height="28" rx="14" fill="none" stroke="#5856d6" stroke-width="1"/>
    <text x="35" y="11" fill="#5856d6" font-size="13" font-family="monospace" text-anchor="middle">ArkTS</text>
  </g>

  <g transform="translate(275, 330)">
    <rect x="0" y="-8" width="75" height="28" rx="14" fill="none" stroke="#5ac8fa" stroke-width="1"/>
    <text x="37" y="11" fill="#5ac8fa" font-size="13" font-family="monospace" text-anchor="middle">3D</text>
  </g>

  <!-- Decorative particle dots -->
  <g fill="#4a9eff" opacity="0.15">
    <circle cx="1050" cy="120" r="2"/>
    <circle cx="1000" cy="180" r="1.5"/>
    <circle cx="1100" cy="350" r="1"/>
    <circle cx="700" cy="450" r="1.5"/>
    <circle cx="600" cy="100" r="1"/>
    <circle cx="550" cy="480" r="2"/>
    <circle cx="150" cy="450" r="1.5"/>
    <circle cx="300" cy="500" r="1"/>
  </g>

  <!-- Bottom accent line -->
  <rect x="80" y="530" width="120" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
