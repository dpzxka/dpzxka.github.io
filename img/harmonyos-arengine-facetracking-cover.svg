<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#0a1a1e"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#48dbfb"/>
      <stop offset="50%" style="stop-color:#0abde3"/>
      <stop offset="100%" style="stop-color:#48dbfb"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1dd1a1"/>
      <stop offset="100%" style="stop-color:#10ac84"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2a3a;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#141b2d;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="mesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48dbfb;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#0abde3;stop-opacity:0.08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#48dbfb" stroke-width="0.5"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="100" cy="530" r="200" fill="none" stroke="#48dbfb" stroke-width="0.5" opacity="0.07"/>
  <circle cx="1100" cy="100" r="130" fill="none" stroke="#1dd1a1" stroke-width="0.5" opacity="0.07"/>

  <!-- Left: Phone with face tracking -->
  <g transform="translate(200, 315)" filter="url(#shadow)">
    <!-- Phone frame -->
    <rect x="-120" y="-170" width="240" height="340" rx="22" fill="url(#card)" stroke="#2a3a4a" stroke-width="1.5"/>
    
    <g clip-path="url(#phoneFaceClip)">
      <clipPath id="phoneFaceClip">
        <rect x="-105" y="-155" width="210" height="310" rx="10"/>
      </clipPath>
      
      <rect x="-105" y="-155" width="210" height="310" fill="#0a0e1a"/>

      <!-- Camera grid -->
      <g opacity="0.08">
        <line x1="-105" y1="-77" x2="105" y2="-77" stroke="#48dbfb" stroke-width="0.3"/>
        <line x1="-105" y1="0" x2="105" y2="0" stroke="#48dbfb" stroke-width="0.3"/>
        <line x1="-105" y1="77" x2="105" y2="77" stroke="#48dbfb" stroke-width="0.3"/>
        <line x1="0" y1="-155" x2="0" y2="155" stroke="#48dbfb" stroke-width="0.3"/>
      </g>

      <!-- Face mesh visualization -->
      <g transform="translate(0, -5)">
        <!-- Face ellipse outline -->
        <ellipse cx="0" cy="0" rx="45" ry="55" fill="none" stroke="#48dbfb" stroke-width="0.8" opacity="0.3"/>
        
        <!-- Mesh triangles (simplified wireframe) -->
        <g stroke="#48dbfb" stroke-width="0.5" opacity="0.25">
          <!-- Forehead triangles -->
          <line x1="-20" y1="-45" x2="-10" y2="-55"/>
          <line x1="-10" y1="-55" x2="10" y2="-55"/>
          <line x1="10" y1="-55" x2="20" y2="-45"/>
          <line x1="-20" y1="-45" x2="20" y2="-45"/>
          <line x1="-10" y1="-55" x2="0" y2="-40"/>
          <line x1="10" y1="-55" x2="0" y2="-40"/>
          
          <!-- Eye area -->
          <line x1="-25" y1="-25" x2="-10" y2="-20"/>
          <line x1="-10" y1="-20" x2="-15" y2="-10"/>
          <line x1="-15" y1="-10" x2="-25" y2="-15"/>
          <line x1="-25" y1="-15" x2="-25" y2="-25"/>
          <line x1="10" y1="-20" x2="25" y2="-25"/>
          <line x1="25" y1="-25" x2="25" y2="-15"/>
          <line x1="25" y1="-15" x2="15" y2="-10"/>
          <line x1="15" y1="-10" x2="10" y2="-20"/>
          
          <!-- Nose area -->
          <line x1="-5" y1="-15" x2="0" y2="5"/>
          <line x1="0" y1="5" x2="5" y2="-15"/>
          <line x1="-5" y1="-15" x2="-10" y2="-5"/>
          <line x1="5" y1="-15" x2="10" y2="-5"/>
          <line x1="-10" y1="-5" x2="0" y2="5"/>
          <line x1="0" y1="5" x2="10" y2="-5"/>
          
          <!-- Cheeks -->
          <line x1="-30" y1="-10" x2="-25" y2="10"/>
          <line x1="-25" y1="10" x2="-15" y2="15"/>
          <line x1="-15" y1="15" x2="-15" y2="-5"/>
          <line x1="-15" y1="-5" x2="-30" y2="-10"/>
          <line x1="15" y1="-5" x2="15" y2="15"/>
          <line x1="15" y1="15" x2="25" y2="10"/>
          <line x1="25" y1="10" x2="30" y2="-10"/>
          <line x1="30" y1="-10" x2="15" y2="-5"/>
          
          <!-- Mouth area -->
          <line x1="-20" y1="20" x2="-10" y2="30"/>
          <line x1="-10" y1="30" x2="0" y2="28"/>
          <line x1="0" y1="28" x2="10" y2="30"/>
          <line x1="10" y1="30" x2="20" y2="20"/>
          <line x1="-20" y1="20" x2="0" y2="22"/>
          <line x1="0" y1="22" x2="20" y2="20"/>
          <line x1="-10" y1="30" x2="0" y2="35"/>
          <line x1="0" y1="35" x2="10" y2="30"/>
          
          <!-- Jaw line -->
          <line x1="-30" y1="5" x2="-20" y2="30"/>
          <line x1="-20" y1="30" x2="0" y2="40"/>
          <line x1="0" y1="40" x2="20" y2="30"/>
          <line x1="20" y1="30" x2="30" y2="5"/>
        </g>

        <!-- Highlighted blend shape region: mouth open -->
        <path d="M-12,28 Q0,38 12,28 Q0,32 -12,28Z" fill="#1dd1a1" opacity="0.5"/>
        
        <!-- Blend shape label arrows -->
        <g stroke="#1dd1a1" stroke-width="1" opacity="0.7">
          <line x1="0" y1="38" x2="0" y2="55"/>
          <polygon points="-4,52 0,58 4,52" fill="#1dd1a1" stroke="none"/>
        </g>
        <text x="12" y="58" fill="#1dd1a1" font-family="monospace" font-size="7">MOUTH_OPEN</text>

        <!-- Left eye brow raised -->
        <path d="M-22,-28 Q-15,-35 -8,-28" fill="none" stroke="#feca57" stroke-width="1.5" opacity="0.7"/>
        <text x="-45" y="-35" fill="#feca57" font-family="monospace" font-size="6">BROW_RAISE</text>
      </g>

      <!-- Corner detection markers -->
      <path d="M-105,-155 L-90,-155 M-105,-155 L-105,-140" stroke="#48dbfb" stroke-width="1.5" fill="none" opacity="0.4"/>
      <path d="M105,-155 L90,-155 M105,-155 L105,-140" stroke="#48dbfb" stroke-width="1.5" fill="none" opacity="0.4"/>
    </g>

    <!-- Phone notch -->
    <rect x="-25" y="-160" width="50" height="5" rx="2.5" fill="#0a0e1a"/>
  </g>

  <!-- Right: Blend shape data panel -->
  <g transform="translate(800, 315)" filter="url(#shadow)">
    <rect x="-140" y="-175" width="280" height="350" rx="12" fill="url(#card)" stroke="#2a3a4a" stroke-width="1"/>
    
    <text x="0" y="-150" text-anchor="middle" fill="#48dbfb" font-family="sans-serif" font-size="13" font-weight="bold">ARBlendShapes (64 种)</text>

    <!-- Blend shape categories -->
    <g transform="translate(0, -115)" font-family="monospace" font-size="7">
      <!-- Eyes -->
      <rect x="-120" y="-5" width="240" height="55" rx="4" fill="none" stroke="#48dbfb" stroke-width="0.3" opacity="0.3"/>
      <text x="-110" y="8" fill="#48dbfb" font-size="8">👁 眼部 (13)</text>
      <text x="-110" y="20" fill="#888">EYE_BLINK_L · EYE_BLINK_R</text>
      <text x="-110" y="32" fill="#888">EYE_WIDE_L · EYE_WIDE_R</text>
      <text x="-110" y="44" fill="#888">EYE_LOOK_UP_L/R · DOWN_L/R · LEFT_L/R · RIGHT_L/R</text>

      <!-- Brows -->
      <rect x="-120" y="55" width="240" height="35" rx="4" fill="none" stroke="#feca57" stroke-width="0.3" opacity="0.3"/>
      <text x="-110" y="68" fill="#feca57" font-size="8">🤨 眉毛 (4)</text>
      <text x="-110" y="80" fill="#888">BROW_DOWN_L · BROW_DOWN_R · BROW_INNER_UP_L · BROW_INNER_UP_R</text>

      <!-- Mouth &amp; Jaw -->
      <rect x="-120" y="95" width="240" height="55" rx="4" fill="none" stroke="#1dd1a1" stroke-width="0.3" opacity="0.3"/>
      <text x="-110" y="108" fill="#1dd1a1" font-size="8">👄 口部 &amp; 下颌 (38)</text>
      <text x="-110" y="120" fill="#888">JAW_OPEN · JAW_LEFT · JAW_RIGHT · MOUTH_OPEN</text>
      <text x="-110" y="132" fill="#888">MOUTH_SMILE_L/R · MOUTH_FROWN_L/R · MOUTH_PUCKER</text>
      <text x="-110" y="144" fill="#888">LIP_UPPER_UP/DOWN · LIP_LOWER_DOWN/UP … etc.</text>
    </g>

    <!-- Code at bottom -->
    <g transform="translate(0, 70)">
      <rect x="-120" y="-10" width="240" height="65" rx="4" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="0.5"/>
      <text x="-110" y="8" fill="#48dbfb" font-family="monospace" font-size="7">session.getAllTrackables(FACE)</text>
      <text x="-110" y="22" fill="#888" font-family="monospace" font-size="7">  → ARFace[]</text>
      <text x="-110" y="36" fill="#1dd1a1" font-family="monospace" font-size="7">face.getBlendShapes() → blend data</text>
      <text x="-110" y="48" fill="#feca57" font-family="monospace" font-size="7">face.getGeometry()   → mesh (4k+ verts)</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="36" font-weight="bold">人脸跟踪与微表情</text>
  <text x="600" y="115" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="14">Face Tracking &amp; Blend Shapes</text>

  <!-- Subtitle area -->
  <rect x="250" y="525" width="700" height="60" rx="30" fill="url(#card)" stroke="#2a3a4a" stroke-width="1"/>
  <text x="600" y="552" text-anchor="middle" fill="#ccc" font-family="sans-serif" font-size="13">ARFace · ARFaceGeometry · ARBlendShapes · 64 种表情系数</text>
  <text x="600" y="572" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="11">面部网格追踪 · 微表情识别 · 4000+ 顶点网格 · API 23+</text>

  <!-- Tech badges -->
  <g transform="translate(430, 135)">
    <rect x="0" y="0" width="90" height="20" rx="10" fill="#48dbfb" opacity="0.15"/>
    <text x="45" y="14" text-anchor="middle" fill="#48dbfb" font-family="monospace" font-size="9">ARType.FACE</text>
  </g>
  <g transform="translate(530, 135)">
    <rect x="0" y="0" width="100" height="20" rx="10" fill="#1dd1a1" opacity="0.15"/>
    <text x="50" y="14" text-anchor="middle" fill="#1dd1a1" font-family="monospace" font-size="9">API 23+</text>
  </g>
  <g transform="translate(640, 135)">
    <rect x="0" y="0" width="120" height="20" rx="10" fill="#feca57" opacity="0.15"/>
    <text x="60" y="14" text-anchor="middle" fill="#feca57" font-family="monospace" font-size="9">64 Blend Shapes</text>
  </g>

  <!-- Bottom line -->
  <line x1="200" y1="605" x2="1000" y2="605" stroke="#2a3a4a" stroke-width="0.5"/>
</svg>
