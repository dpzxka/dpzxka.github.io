<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070b14"/>
      <stop offset="50%" style="stop-color:#111827"/>
      <stop offset="100%" style="stop-color:#070b14"/>
    </linearGradient>
    <linearGradient id="depthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="30%" style="stop-color:#16213e"/>
      <stop offset="60%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="poseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="50%" style="stop-color:#f5a623"/>
      <stop offset="100%" style="stop-color:#e94560"/>
    </linearGradient>
    <linearGradient id="depthHeat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="40%" style="stop-color:#feca57"/>
      <stop offset="70%" style="stop-color:#48dbfb"/>
      <stop offset="100%" style="stop-color:#0abde3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#48dbfb" stroke-width="0.3"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)"/>
  </g>

  <!-- Decorative -->
  <circle cx="1050" cy="500" r="180" fill="none" stroke="#e94560" stroke-width="0.5" opacity="0.06"/>
  <circle cx="150" cy="130" r="120" fill="none" stroke="#48dbfb" stroke-width="0.5" opacity="0.06"/>

  <!-- ===== LEFT SIDE: Depth Estimation ===== -->
  <g transform="translate(300, 315)" filter="url(#shadow)">
    <rect x="-140" y="-170" width="280" height="340" rx="20" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="1"/>
    
    <!-- Depth view label -->
    <text x="0" y="-150" text-anchor="middle" fill="#48dbfb" font-family="sans-serif" font-size="11" font-weight="bold">深度估计</text>

    <!-- Depth heatmap visualization -->
    <g transform="translate(0, -60)">
      <rect x="-100" y="-60" width="200" height="120" rx="6" fill="url(#depthGrad)"/>
      
      <!-- Heatmap color bands -->
      <g opacity="0.3">
        <rect x="-100" y="-60" width="200" height="20" fill="#ff6b6b" rx="6"/>
        <rect x="-100" y="-40" width="200" height="20" fill="#feca57"/>
        <rect x="-100" y="-20" width="200" height="20" fill="#48dbfb"/>
        <rect x="-100" y="0" width="200" height="20" fill="#0abde3"/>
        <rect x="-100" y="20" width="200" height="20" fill="#1a1a2e"/>
      </g>

      <!-- Center point marker -->
      <circle cx="0" cy="0" r="4" fill="none" stroke="#fff" stroke-width="1.5"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#fff" stroke-width="0.5"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#fff" stroke-width="0.5"/>

      <!-- Distance annotation -->
      <g transform="translate(0, 35)">
        <rect x="-35" y="-10" width="70" height="20" rx="10" fill="#fff" opacity="0.15"/>
        <text x="0" y="5" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10">1.24m</text>
      </g>
    </g>

    <!-- Depth data info -->
    <g transform="translate(0, 60)">
      <text x="-110" y="0" fill="#888" font-family="monospace" font-size="8">depthImage16Bits:</text>
      <text x="-110" y="14" fill="#666" font-family="monospace" font-size="7">format: DEPTH_16 640×480</text>
      <text x="-110" y="28" fill="#666" font-family="monospace" font-size="7">center: 1240mm (1.24m)</text>
      <text x="-110" y="42" fill="#666" font-family="monospace" font-size="7">confidence: 0.92</text>
    </g>

    <!-- Depth scale bar -->
    <g transform="translate(0, 115)">
      <rect x="-80" y="0" width="160" height="6" rx="3" fill="url(#depthHeat)"/>
      <text x="-80" y="16" fill="#888" font-family="monospace" font-size="6">近</text>
      <text x="72" y="16" fill="#888" font-family="monospace" font-size="6">远</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="600" y1="120" x2="600" y2="510" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>

  <!-- ===== RIGHT SIDE: Device Pose ===== -->
  <g transform="translate(900, 315)" filter="url(#shadow)">
    <rect x="-140" y="-170" width="280" height="340" rx="20" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="1"/>

    <!-- Pose view label -->
    <text x="0" y="-150" text-anchor="middle" fill="#e94560" font-family="sans-serif" font-size="11" font-weight="bold">设备位姿</text>

    <!-- 3D coordinate axes -->
    <g transform="translate(0, -55)">
      <!-- Ground grid -->
      <g opacity="0.15">
        <line x1="-60" y1="20" x2="60" y2="20" stroke="#e94560" stroke-width="0.3"/>
        <line x1="-60" y1="0" x2="60" y2="0" stroke="#e94560" stroke-width="0.3"/>
        <line x1="-60" y1="-20" x2="60" y2="-20" stroke="#e94560" stroke-width="0.3"/>
        <line x1="-30" y1="-30" x2="-30" y2="40" stroke="#e94560" stroke-width="0.3"/>
        <line x1="0" y1="-30" x2="0" y2="40" stroke="#e94560" stroke-width="0.3"/>
        <line x1="30" y1="-30" x2="30" y2="40" stroke="#e94560" stroke-width="0.3"/>
      </g>

      <!-- Device/phone icon at origin -->
      <g transform="translate(0, 5)">
        <rect x="-12" y="-20" width="24" height="40" rx="4" fill="#1a2a3a" stroke="#e94560" stroke-width="1.5"/>
        <rect x="-8" y="-15" width="16" height="25" rx="2" fill="#0d1b2a"/>
      </g>

      <!-- Axis arrows -->
      <line x1="0" y1="5" x2="0" y2="-50" stroke="#ff6b6b" stroke-width="2"/>
      <polygon points="0,-54 -4,-46 4,-46" fill="#ff6b6b"/>
      <text x="4" y="-56" fill="#ff6b6b" font-family="monospace" font-size="10">Y</text>

      <line x1="0" y1="5" x2="50" y2="5" stroke="#48dbfb" stroke-width="2"/>
      <polygon points="54,5 46,1 46,9" fill="#48dbfb"/>
      <text x="54" y="12" fill="#48dbfb" font-family="monospace" font-size="10">X</text>

      <line x1="0" y1="5" x2="15" y2="35" stroke="#92fe9d" stroke-width="2"/>
      <text x="16" y="42" fill="#92fe9d" font-family="monospace" font-size="10">Z</text>
    </g>

    <!-- Pose data display -->
    <g transform="translate(0, 60)">
      <text x="-110" y="0" fill="#888" font-family="monospace" font-size="8">getCamera().getPose():</text>
      <text x="-110" y="14" fill="#666" font-family="monospace" font-size="7">translation:</text>
      <text x="-100" y="26" fill="#48dbfb" font-family="monospace" font-size="7">x: 0.12  y: 1.65  z: -0.45</text>
      <text x="-110" y="42" fill="#666" font-family="monospace" font-size="7">stateReason:</text>
      <text x="-100" y="54" fill="#feca57" font-family="monospace" font-size="7">TRACKING</text>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="70" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="36" font-weight="bold">深度估计 &amp; 设备位姿</text>
  <text x="600" y="105" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="14">Depth Estimation &amp; Device Pose</text>

  <!-- Subtitle bar -->
  <rect x="200" y="530" width="800" height="60" rx="30" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="1"/>
  <text x="600" y="555" text-anchor="middle" fill="#ccc" font-family="sans-serif" font-size="13">深度图 · 置信度 · 相机位姿 · 跟踪状态 · 6-DoF</text>
  <text x="600" y="575" text-anchor="middle" fill="#666" font-family="sans-serif" font-size="11">acquireDepthImage16Bits · DepthConfidence · ARCamera.getPose</text>

  <!-- Badges -->
  <g transform="translate(400, 125)">
    <rect x="0" y="0" width="90" height="20" rx="10" fill="#48dbfb" opacity="0.15"/>
    <text x="45" y="14" text-anchor="middle" fill="#48dbfb" font-family="monospace" font-size="9">depthMode</text>
  </g>
  <g transform="translate(530, 125)">
    <rect x="0" y="0" width="40" height="20" rx="10" fill="#feca57" opacity="0.15"/>
    <text x="20" y="14" text-anchor="middle" fill="#feca57" font-family="monospace" font-size="9">API</text>
  </g>
  <g transform="translate(610, 125)">
    <rect x="0" y="0" width="100" height="20" rx="10" fill="#e94560" opacity="0.15"/>
    <text x="50" y="14" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="9">getPose()</text>
  </g>
  <g transform="translate(745, 125)">
    <rect x="0" y="0" width="80" height="20" rx="10" fill="#92fe9d" opacity="0.15"/>
    <text x="40" y="14" text-anchor="middle" fill="#92fe9d" font-family="monospace" font-size="9">6-DoF</text>
  </g>
</svg>