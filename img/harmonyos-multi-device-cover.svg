<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929"/>
      <stop offset="50%" style="stop-color:#0d2137"/>
      <stop offset="100%" style="stop-color:#0a1929"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#007DFF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00B4D8;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FF9F1C;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007DFF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00B4D8;stop-opacity:0.15"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Grid pattern background -->
  <g opacity="0.08">
    <line x1="0" y1="0" x2="0" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="450" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="0" x2="800" y2="0" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="90" x2="800" y2="90" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="270" x2="800" y2="270" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#007DFF" stroke-width="1"/>
    <line x1="0" y1="450" x2="800" y2="450" stroke="#007DFF" stroke-width="1"/>
  </g>

  <!-- Breakpoint markers -->
  <g filter="url(#glow)">
    <!-- xs breakpoint -->
    <line x1="140" y1="380" x2="140" y2="410" stroke="#007DFF" stroke-width="2"/>
    <text x="140" y="430" text-anchor="middle" font-family="Arial" font-size="11" fill="#007DFF">xs</text>
    
    <!-- sm breakpoint -->
    <line x1="220" y1="380" x2="220" y2="410" stroke="#007DFF" stroke-width="2"/>
    <text x="220" y="430" text-anchor="middle" font-family="Arial" font-size="11" fill="#007DFF">sm</text>
    
    <!-- md breakpoint -->
    <line x1="320" y1="380" x2="320" y2="410" stroke="#00B4D8" stroke-width="2"/>
    <text x="320" y="430" text-anchor="middle" font-family="Arial" font-size="11" fill="#00B4D8">md</text>
    
    <!-- lg breakpoint -->
    <line x1="500" y1="380" x2="500" y2="410" stroke="#00B4D8" stroke-width="2"/>
    <text x="500" y="430" text-anchor="middle" font-family="Arial" font-size="11" fill="#00B4D8">lg</text>
    
    <!-- xl breakpoint -->
    <line x1="680" y1="380" x2="680" y2="410" stroke="#FF6B35" stroke-width="2"/>
    <text x="680" y="430" text-anchor="middle" font-family="Arial" font-size="11" fill="#FF6B35">xl</text>
  </g>

  <!-- Breakpoint range bars -->
  <rect x="10" y="395" width="130" height="6" rx="3" fill="url(#glow1)" opacity="0.6"/>
  <rect x="140" y="395" width="80" height="6" rx="3" fill="url(#glow1)" opacity="0.6"/>
  <rect x="220" y="395" width="100" height="6" rx="3" fill="url(#gridGrad)" opacity="0.6"/>
  <rect x="320" y="395" width="180" height="6" rx="3" fill="url(#gridGrad)" opacity="0.6"/>
  <rect x="500" y="395" width="300" height="6" rx="3" fill="url(#glow2)" opacity="0.6"/>

  <!-- Device illustrations -->
  <!-- Phone -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="60" height="110" rx="8" fill="#0d2137" stroke="#007DFF" stroke-width="1.5"/>
    <rect x="5" y="12" width="50" height="80" rx="2" fill="#007DFF" opacity="0.2"/>
    <circle cx="30" cy="102" r="4" fill="none" stroke="#007DFF" stroke-width="1"/>
    <text x="30" y="55" text-anchor="middle" font-family="Arial" font-size="9" fill="#007DFF">Phone</text>
  </g>

  <!-- Tablet -->
  <g transform="translate(230, 50)">
    <rect x="0" y="0" width="100" height="130" rx="8" fill="#0d2137" stroke="#00B4D8" stroke-width="1.5"/>
    <rect x="5" y="12" width="90" height="100" rx="2" fill="#00B4D8" opacity="0.2"/>
    <text x="50" y="70" text-anchor="middle" font-family="Arial" font-size="10" fill="#00B4D8">Tablet</text>
  </g>

  <!-- Foldable -->
  <g transform="translate(400, 55)">
    <rect x="0" y="0" width="130" height="120" rx="8" fill="#0d2137" stroke="#A855F7" stroke-width="1.5"/>
    <line x1="65" y1="0" x2="65" y2="120" stroke="#A855F7" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="5" y="12" width="55" height="95" rx="2" fill="#A855F7" opacity="0.15"/>
    <rect x="70" y="12" width="55" height="95" rx="2" fill="#A855F7" opacity="0.15"/>
    <text x="65" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#A855F7">Foldable</text>
  </g>

  <!-- PC -->
  <g transform="translate(600, 50)">
    <rect x="0" y="0" width="140" height="100" rx="6" fill="#0d2137" stroke="#FF6B35" stroke-width="1.5"/>
    <rect x="5" y="8" width="130" height="80" rx="2" fill="#FF6B35" opacity="0.2"/>
    <rect x="50" y="100" width="60" height="6" rx="3" fill="#FF6B35" opacity="0.5"/>
    <text x="70" y="55" text-anchor="middle" font-family="Arial" font-size="10" fill="#FF6B35">PC</text>
  </g>

  <!-- Wearable -->
  <g transform="translate(180, 230)">
    <circle cx="35" cy="35" r="30" fill="#0d2137" stroke="#22C55E" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="24" fill="none" stroke="#22C55E" stroke-width="1" opacity="0.4"/>
    <text x="35" y="38" text-anchor="middle" font-family="Arial" font-size="9" fill="#22C55E">Watch</text>
  </g>

  <!-- Car -->
  <g transform="translate(580, 230)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="#0d2137" stroke="#F97316" stroke-width="1.5"/>
    <rect x="5" y="8" width="140" height="40" rx="2" fill="#F97316" opacity="0.2"/>
    <text x="75" y="32" text-anchor="middle" font-family="Arial" font-size="10" fill="#F97316">Car</text>
  </g>

  <!-- Connection lines -->
  <g stroke="#007DFF" stroke-width="1" stroke-dasharray="4,4" opacity="0.3">
    <line x1="90" y1="180" x2="200" y2="230"/>
    <line x1="280" y1="185" x2="220" y2="230"/>
    <line x1="465" y1="180" x2="465" y2="225"/>
    <line x1="670" y1="160" x2="660" y2="230"/>
  </g>

  <!-- Title -->
  <text x="400" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">
    多端适配完全指南
  </text>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#94A3B8">
    从断点到栅格 · 响应式布局
  </text>

  <!-- Decorative code elements -->
  <g opacity="0.15" font-family="monospace" font-size="10" fill="#007DFF">
    <text x="20" y="320">GridRow({</text>
    <text x="30" y="335">columns: {</text>
    <text x="40" y="350">sm: 4, md: 8, lg: 12</text>
    <text x="30" y="365">}</text>
    <text x="20" y="380">})</text>
  </g>

  <g opacity="0.15" font-family="monospace" font-size="10" fill="#00B4D8">
    <text x="620" y="320">mediaquery</text>
    <text x="630" y="335">.matchMedia</text>
    <text x="640" y="350">('(width >= 600vp)')</text>
    <text x="630" y="365">.on('change')</text>
  </g>

  <!-- Bottom decoration -->
  <rect x="0" y="445" width="800" height="5" fill="url(#glow1)" opacity="0.3"/>
</svg>