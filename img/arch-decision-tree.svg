<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520">
  <defs>
    <linearGradient id="bgdt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d1e"/>
      <stop offset="100%" stop-color="#151530"/>
    </linearGradient>
    <filter id="shadt">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
    <marker id="arrowTree" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="rgba(255,255,255,0.2)"/>
    </marker>
  </defs>

  <rect width="700" height="520" rx="16" fill="url(#bgdt)"/>

  <text x="350" y="28" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">状态装饰器选择决策树</text>

  <!-- Root question -->
  <g filter="url(#shadt)">
    <rect x="225" y="46" width="250" height="36" rx="18" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="1.2"/>
    <text x="350" y="69" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">这个状态属于谁？</text>
  </g>

  <!-- Branch lines from root -->
  <line x1="260" y1="82" x2="140" y2="120" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="350" y1="82" x2="350" y2="120" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="440" y1="82" x2="560" y2="120" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Branch 1: internal -->
  <g filter="url(#shadt)">
    <rect x="50" y="124" width="180" height="36" rx="8" fill="rgba(233,69,96,0.06)" stroke="rgba(233,69,96,0.2)" stroke-width="1"/>
    <text x="140" y="147" text-anchor="middle" fill="#e94560" font-family="system-ui, sans-serif" font-size="11" font-weight="600">只属于组件自己</text>
  </g>

  <line x1="140" y1="160" x2="140" y2="182" stroke="rgba(255,255,255,0.12)" stroke-width="1" marker-end="url(#arrowTree)"/>

  <g filter="url(#shadt)">
    <rect x="60" y="186" width="160" height="40" rx="8" fill="rgba(233,69,96,0.1)" stroke="#e94560" stroke-width="1.2"/>
    <text x="140" y="205" text-anchor="middle" fill="#ff8a9e" font-family="monospace, sans-serif" font-size="13" font-weight="600">@Local</text>
    <text x="140" y="219" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="system-ui, sans-serif" font-size="8">组件内部状态</text>
  </g>

  <!-- Branch 2: external -->
  <g filter="url(#shadt)">
    <rect x="260" y="124" width="180" height="36" rx="8" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
    <text x="350" y="147" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">从外部传入</text>
  </g>

  <line x1="350" y1="160" x2="350" y2="182" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Sub-branches for external -->
  <line x1="300" y1="182" x2="250" y2="210" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="400" y1="182" x2="450" y2="210" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Sub: just display -->
  <rect x="170" y="214" width="160" height="36" rx="8" fill="rgba(0,212,255,0.04)" stroke="rgba(0,212,255,0.12)" stroke-width="0.8"/>
  <text x="250" y="234" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="9">只是展示，不修改</text>

  <line x1="250" y1="250" x2="250" y2="270" stroke="rgba(255,255,255,0.1)" stroke-width="1" marker-end="url(#arrowTree)"/>

  <rect x="175" y="274" width="150" height="36" rx="8" fill="rgba(0,212,255,0.08)" stroke="#00d4ff" stroke-width="1"/>
  <text x="250" y="293" text-anchor="middle" fill="#00d4ff" font-family="monospace, sans-serif" font-size="12" font-weight="600">@Param</text>
  <text x="250" y="305" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="8">单向数据流</text>

  <!-- Sub: need to modify -->
  <rect x="370" y="214" width="160" height="36" rx="8" fill="rgba(255,159,67,0.04)" stroke="rgba(255,159,67,0.12)" stroke-width="0.8"/>
  <text x="450" y="234" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="9">需要通知父组件</text>

  <line x1="450" y1="250" x2="450" y2="270" stroke="rgba(255,255,255,0.1)" stroke-width="1" marker-end="url(#arrowTree)"/>

  <rect x="370" y="274" width="160" height="36" rx="8" fill="rgba(255,159,67,0.08)" stroke="#ff9f43" stroke-width="1"/>
  <text x="450" y="293" text-anchor="middle" fill="#ff9f43" font-family="monospace, sans-serif" font-size="12" font-weight="600">@Param + @Event</text>
  <text x="450" y="305" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="8">受控组件模式</text>

  <!-- Branch 3: cross-level -->
  <g filter="url(#shadt)">
    <rect x="470" y="124" width="180" height="36" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
    <text x="560" y="147" text-anchor="middle" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">跨多层传递</text>
  </g>

  <line x1="560" y1="160" x2="560" y2="182" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <line x1="530" y1="182" x2="510" y2="210" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="590" y1="182" x2="610" y2="210" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Cross-level sub: Provider/Consumer -->
  <rect x="430" y="214" width="160" height="36" rx="8" fill="rgba(124,58,237,0.04)" stroke="rgba(124,58,237,0.12)" stroke-width="0.8"/>
  <text x="510" y="234" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="9">跨层级共享</text>

  <line x1="510" y1="250" x2="510" y2="270" stroke="rgba(255,255,255,0.1)" stroke-width="1" marker-end="url(#arrowTree)"/>

  <rect x="435" y="274" width="150" height="36" rx="8" fill="rgba(124,58,237,0.08)" stroke="#a855f7" stroke-width="1"/>
  <text x="510" y="293" text-anchor="middle" fill="#a855f7" font-family="monospace, sans-serif" font-size="12" font-weight="600">@Provider/@Consumer</text>
  <text x="510" y="305" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="8">跨级状态共享</text>

  <!-- Cross-level sub: global -->
  <rect x="570" y="214" width="100" height="36" rx="8" fill="rgba(75,192,192,0.04)" stroke="rgba(75,192,192,0.12)" stroke-width="0.8"/>
  <text x="620" y="234" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="9">全局使用</text>

  <line x1="620" y1="250" x2="620" y2="270" stroke="rgba(255,255,255,0.1)" stroke-width="1" marker-end="url(#arrowTree)"/>

  <rect x="565" y="274" width="110" height="36" rx="8" fill="rgba(75,192,192,0.08)" stroke="#4bc0c0" stroke-width="1"/>
  <text x="620" y="293" text-anchor="middle" fill="#4bc0c0" font-family="monospace, sans-serif" font-size="12" font-weight="600">AppStorage</text>
  <text x="620" y="305" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="8">全局状态</text>

  <!-- Tags/Annotations -->
  <!-- Performance tip -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="600" height="60" rx="8" fill="rgba(75,192,192,0.04)" stroke="rgba(75,192,192,0.08)" stroke-width="0.8"/>
    <text x="16" y="18" fill="#4bc0c0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">性能提示</text>
    <text x="16" y="36" fill="rgba(255,255,255,0.3)" font-family="system-ui, sans-serif" font-size="9">大对象少数属性频繁变化 → 用 @Track 标记独立属性</text>
    <text x="16" y="52" fill="rgba(255,255,255,0.3)" font-family="system-ui, sans-serif" font-size="9">需要监听具体属性变化 → @Monitor('path') + @Track</text>
  </g>

  <!-- Rule -->
  <g transform="translate(50, 430)">
    <rect x="0" y="0" width="600" height="40" rx="8" fill="rgba(233,69,96,0.03)" stroke="rgba(233,69,96,0.06)" stroke-width="0.8"/>
    <text x="16" y="18" fill="rgba(255,255,255,0.2)" font-family="system-ui, sans-serif" font-size="9">核心原则：@Local 管自己的状态，@Param 管传入的数据，@Provider/@Consumer 管跨级共享</text>
    <text x="16" y="33" fill="rgba(255,255,255,0.15)" font-family="system-ui, sans-serif" font-size="8">避免在 ViewModel 中做 UI 操作 · 避免在 View 中直接请求数据</text>
  </g>
</svg>
