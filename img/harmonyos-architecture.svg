      <text x="61" y="311" text-anchor="middle" fill="rgba(124,58,237,0.5)" font-family="monospace, sans-serif" font-size="9">Navigator</text>

      <rect x="118" y="296" width="100" height="20" rx="6" fill="rgba(124,58,237,0.05)"/>
      <text x="168" y="311" text-anchor="middle" fill="rgba(124,58,237,0.5)" font-family="monospace, sans-serif" font-size="9">RoutePath</text>

      <rect x="230" y="296" width="100" height="20" rx="6" fill="rgba(124,58,237,0.05)"/>
      <text x="280" y="311" text-anchor="middle" fill="rgba(124,58,237,0.5)" font-family="monospace, sans-serif" font-size="9">Interceptor</text>

      <rect x="342" y="296" width="120" height="20" rx="6" fill="rgba(124,58,237,0.05)"/>
      <text x="402" y="311" text-anchor="middle" fill="rgba(124,58,237,0.5)" font-family="monospace, sans-serif" font-size="9">@HMRouter</text>
    </g>
  </g>

  <!-- Sidebar: Module structure preview -->
  <g transform="translate(50, 175)">
    <text x="0" y="0" fill="rgba(255,255,255,0.3)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">工程模块结构</text>

    <rect x="0" y="14" width="340" height="330" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.04)" stroke-width="0.8"/>

    <text x="16" y="36" fill="rgba(0,212,255,0.5)" font-family="monospace, sans-serif" font-size="9">entry/</text>
    <text x="100" y="36" fill="rgba(255,255,255,0.15)" font-family="system-ui, sans-serif" font-size="8">壳工程</text>

    <text x="16" y="56" fill="rgba(233,69,96,0.5)" font-family="monospace, sans-serif" font-size="9">feature/</text>
    <text x="100" y="56" fill="rgba(255,255,255,0.15)" font-family="system-ui, sans-serif" font-size="8">业务模块</text>

    <text x="32" y="74" fill="rgba(255,255,255,0.3)" font-family="monospace, sans-serif" font-size="9">feature-home/</text>
    <text x="32" y="90" fill="rgba(255,255,255,0.3)" font-family="monospace, sans-serif" font-size="9">feature-article/</text>
    <text x="32" y="106" fill="rgba(255,255,255,0.3)" font-family="monospace, sans-serif" font-size="9">feature-login/</text>
    <text x="32" y="122" fill="rgba(255,255,255,0.3)" font-family="monospace, sans-serif" font-size="9">feature-profile/</text>
    <text x="32" y="138" fill="rgba(255,255,255,0.3)" font-family="monospace, sans-serif" font-size="9">feature-search/</text>

    <text x="16" y="164" fill="rgba(75,192,192,0.5)" font-family="monospace, sans-serif" font-size="9">common/</text>
    <text x="100" y="164" fill="rgba(255,255,255,0.15)" font-family="system-ui, sans-serif" font-size="8">公共基础</text>

    <text x="32" y="182" fill="rgba(255,255,255,0.3)" font-family="monospace, sans-serif" font-size="9">common-ui/</text>
    <text x="32" y="198" fill="rgba(255,255,255,0.3)" font-family="monospace, sans-serif" font-size="9">common-network/</text>
    <text x="32" y="214" fill="rgba(255,255,255,0.3)" font-family="monospace, sans-serif" font-size="9">common-utils/</text>

    <text x="16" y="240" fill="rgba(124,58,237,0.5)" font-family="monospace, sans-serif" font-size="9">router/</text>
    <text x="100" y="240" fill="rgba(255,255,255,0.15)" font-family="system-ui, sans-serif" font-size="8">路由中心</text>

    <text x="16" y="260" fill="rgba(255,159,67,0.5)" font-family="monospace, sans-serif" font-size="9">shared/</text>
    <text x="100" y="260" fill="rgba(255,255,255,0.15)" font-family="system-ui, sans-serif" font-size="8">共享数据 (hsp)</text>

    <text x="32" y="278" fill="rgba(255,255,255,0.3)" font-family="monospace, sans-serif" font-size="9">model/</text>
    <text x="120" y="278" fill="rgba(255,255,255,0.15)" font-family="system-ui, sans-serif" font-size="8">数据模型</text>
    <text x="32" y="294" fill="rgba(255,255,255,0.3)" font-family="monospace, sans-serif" font-size="9">repository/</text>
    <text x="120" y="294" fill="rgba(255,255,255,0.15)" font-family="system-ui, sans-serif" font-size="8">数据仓储</text>
    <text x="32" y="310" fill="rgba(255,255,255,0.3)" font-family="monospace, sans-serif" font-size="9">theme/</text>
    <text x="120" y="310" fill="rgba(255,255,255,0.15)" font-family="system-ui, sans-serif" font-size="8">主题管理</text>

    <!-- Data flow -->
    <text x="0" y="350" fill="rgba(255,255,255,0.3)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">数据流向</text>
    <text x="16" y="370" fill="rgba(255,255,255,0.2)" font-family="system-ui, sans-serif" font-size="10">View → Event → ViewModel → Data</text>
  </g>

  <!-- Footer -->
  <rect x="50" y="585" width="60" height="3" rx="1.5" fill="url(#cyan)"/>
  <text x="125" y="589" fill="rgba(255,255,255,0.2)" font-family="system-ui, sans-serif" font-size="12">鸿蒙 V2 组件开发系列 · 完结篇 · 10 篇全</text>
</svg>
