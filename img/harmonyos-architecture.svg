<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08081a"/>
      <stop offset="50%" stop-color="#10102e"/>
      <stop offset="100%" stop-color="#181842"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4bc0c0"/>
      <stop offset="100%" stop-color="#2ecc71"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9f43"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- BG -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid dots -->
  <g opacity="0.035">
    <pattern id="d" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#ffffff"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#d)"/>
  </g>

  <circle cx="150" cy="130" r="180" fill="rgba(0,212,255,0.025)"/>
  <circle cx="1050" cy="520" r="220" fill="rgba(124,58,237,0.03)"/>

  <!-- Title -->
  <rect x="50" y="35" width="175" height="28" rx="14" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.2)" stroke-width="0.8"/>
  <text x="137" y="54" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ARCHITECTURE · 架构</text>

  <text x="50" y="105" fill="#ffffff" font-family="system-ui, sans-serif" font-size="36" font-weight="700">
    鸿蒙 V2 项目架构设计
  </text>
  <text x="50" y="140" fill="rgba(255,255,255,0.5)" font-family="system-ui, sans-serif" font-size="15">
    多模块划分 · MVVM 分层 · 路由封装 · 工程模板
  </text>

  <!-- Architecture Layers Visualization -->
  <g transform="translate(420, 175)">

    <!-- Layer 4: View -->
    <g filter="url(#shadow)">
      <rect x="0" y="0" width="730" height="72" rx="10" fill="rgba(0,212,255,0.05)" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
      <rect x="0" y="0" width="730" height="24" rx="10" fill="rgba(0,212,255,0.08)"/>
      <rect x="0" y="12" width="730" height="12" fill="rgba(0,212,255,0.08)"/>
      <text x="16" y="16" fill="#00d4ff" font-family="monospace, sans-serif" font-size="11" font-weight="600">View 层</text>
      <text x="130" y="16" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="9">页面组件 · 表单 · 卡片 · 布局</text>

      <rect x="16" y="34" width="160" height="26" rx="6" fill="rgba(0,212,255,0.06)"/>
      <text x="96" y="51" text-anchor="middle" fill="rgba(0,212,255,0.5)" font-family="monospace, sans-serif" font-size="9">@ComponentV2 Page</text>

      <rect x="188" y="34" width="130" height="26" rx="6" fill="rgba(0,212,255,0.06)"/>
      <text x="253" y="51" text-anchor="middle" fill="rgba(0,212,255,0.5)" font-family="monospace, sans-serif" font-size="9">@Builder</text>

      <rect x="330" y="34" width="145" height="26" rx="6" fill="rgba(0,212,255,0.06)"/>
      <text x="402" y="51" text-anchor="middle" fill="rgba(0,212,255,0.5)" font-family="monospace, sans-serif" font-size="9">@BuilderParam</text>

      <rect x="487" y="34" width="100" height="26" rx="6" fill="rgba(0,212,255,0.06)"/>
      <text x="537" y="51" text-anchor="middle" fill="rgba(0,212,255,0.5)" font-family="monospace, sans-serif" font-size="9">Widget</text>
    </g>

    <!-- Arrow -->
    <line x1="365" y1="78" x2="365" y2="92" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Layer 3: ViewModel -->
    <g filter="url(#shadow)">
      <rect x="0" y="96" width="730" height="60" rx="10" fill="rgba(233,69,96,0.04)" stroke="rgba(233,69,96,0.12)" stroke-width="1"/>
      <rect x="0" y="96" width="730" height="24" rx="10" fill="rgba(233,69,96,0.07)"/>
      <rect x="0" y="108" width="730" height="12" fill="rgba(233,69,96,0.07)"/>
      <text x="16" y="112" fill="#e94560" font-family="monospace, sans-serif" font-size="11" font-weight="600">ViewModel 层</text>
      <text x="150" y="112" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="9">状态管理 · 业务逻辑 · 副作用</text>

      <rect x="16" y="128" width="120" height="20" rx="6" fill="rgba(233,69,96,0.05)"/>
      <text x="76" y="143" text-anchor="middle" fill="rgba(233,69,96,0.5)" font-family="monospace, sans-serif" font-size="9">@Local</text>

      <rect x="148" y="128" width="130" height="20" rx="6" fill="rgba(233,69,96,0.05)"/>
      <text x="213" y="143" text-anchor="middle" fill="rgba(233,69,96,0.5)" font-family="monospace, sans-serif" font-size="9">@Provider/@Consumer</text>

      <rect x="290" y="128" width="110" height="20" rx="6" fill="rgba(233,69,96,0.05)"/>
      <text x="345" y="143" text-anchor="middle" fill="rgba(233,69,96,0.5)" font-family="monospace, sans-serif" font-size="9">@Monitor</text>

      <rect x="412" y="128" width="120" height="20" rx="6" fill="rgba(233,69,96,0.05)"/>
      <text x="472" y="143" text-anchor="middle" fill="rgba(233,69,96,0.5)" font-family="monospace, sans-serif" font-size="9">@Track</text>
    </g>

    <!-- Arrow -->
    <line x1="365" y1="162" x2="365" y2="176" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Layer 2: Data + Network -->
    <g filter="url(#shadow)">
      <rect x="0" y="180" width="730" height="60" rx="10" fill="rgba(75,192,192,0.04)" stroke="rgba(75,192,192,0.12)" stroke-width="1"/>
      <rect x="0" y="180" width="730" height="24" rx="10" fill="rgba(75,192,192,0.07)"/>
      <rect x="0" y="192" width="730" height="12" fill="rgba(75,192,192,0.07)"/>
      <text x="16" y="196" fill="#4bc0c0" font-family="monospace, sans-serif" font-size="11" font-weight="600">Data 层</text>
      <text x="120" y="196" fill="rgba(255,255,255,0.25)" font-family="system-ui, sans-serif" font-size="9">数据模型 · 网络请求 · 本地持久化</text>

      <rect x="16" y="212" width="110" height="20" rx="6" fill="rgba(75,192,192,0.05)"/>
      <text x="71" y="227" text-anchor="middle" fill="rgba(75,192,192,0.5)" font-family="monospace, sans-serif" font-size="9">Repository</text>

      <rect x="138" y="212" width="70" height="20" rx="6" fill="rgba(75,192,192,0.05)"/>
      <text x="173" y="227" text-anchor="middle" fill="rgba(75,192,192,0.5)" font-family="monospace, sans-serif" font-size="9">RCP</text>

      <rect x="220" y="212" width="130" height="20" rx="6" fill="rgba(75,192,192,0.05)"/>
      <text x="285" y="227" text-anchor="middle" fill="rgba(75,192,192,0.5)" font-family="monospace, sans-serif" font-size="9">Preferences/KVStore</text>

      <rect x="362" y="212" width="100" height="20" rx="6" fill="rgba(75,192,192,0.05)"/>
      <text x="412" y="227" text-anchor="middle" fill="rgba(75,192,192,0.5)" font-family="monospace, sans-serif" font-size="9">Data Model</text>
    </g>

    <!-- Arrow -->
    <line x1="365" y1="246" x2="365" y2="260" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Layer 1: Route -->
    <g filter="url(#shadow)">
      <rect x="0" y="264" width="730" height="60" rx="10" fill="rgba(124,58,237,0.04)" stroke="rgba(124,58,237,0.12)" stroke-width="1"/>
      <rect x="0" y="264" width="730" height="24" rx="10" fill="rgba(124,58,237,0.07)"/>
      <rect x="0" y="276" width="730" height="12" fill="rgba(124,58,237,0.07)"/>
