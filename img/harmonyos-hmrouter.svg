<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="40%" stop-color="#14142e"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b81"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g opacity="0.04">
    <pattern id="g" width="35" height="35" patternUnits="userSpaceOnUse">
      <circle cx="17.5" cy="17.5" r="1" fill="#ffffff"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#g)"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="rgba(0,212,255,0.03)"/>
  <circle cx="1100" cy="530" r="250" fill="rgba(124,58,237,0.04)"/>
  <circle cx="600" cy="315" r="300" fill="rgba(233,69,96,0.015)"/>

  <!-- Title section -->
  <rect x="50" y="40" width="130" height="28" rx="14" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.25)" stroke-width="0.8"/>
  <text x="115" y="59" text-anchor="middle" fill="#00d4ff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">HMRouter · 路由</text>

  <text x="50" y="115" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="700">
    鸿蒙 HMRouter 完全解析
  </text>
  <text x="50" y="155" fill="rgba(255,255,255,0.55)" font-family="system-ui, sans-serif" font-size="16">
    从注解路由到二次封装 · 构建类型安全的业务路由层
  </text>

  <!-- Architecture visualization: Three-layer routing structure -->

  <!-- Layer 1: HMRouter Annotations -->
  <g filter="url(#shadow)">
    <rect x="380" y="195" width="770" height="385" rx="14" fill="rgba(0,212,255,0.03)" stroke="rgba(0,212,255,0.12)" stroke-width="1"/>
    <rect x="380" y="195" width="770" height="34" rx="14" fill="rgba(0,212,255,0.06)"/>
    <rect x="380" y="217" width="770" height="12" fill="rgba(0,212,255,0.06)"/>
    <text x="765" y="218" text-anchor="middle" fill="#00d4ff" font-family="monospace, sans-serif" font-size="12" font-weight="600">Navigator.toXxx() — 业务路由层</text>

    <!-- RoutePath constants block -->
    <rect x="400" y="248" width="730" height="42" rx="8" fill="rgba(0,212,255,0.04)" stroke="rgba(0,212,255,0.08)" stroke-width="0.8"/>
    <text x="440" y="268" fill="rgba(0,212,255,0.5)" font-family="monospace, sans-serif" font-size="10">RoutePath</text>
    <text x="500" y="268" fill="rgba(255,255,255,0.35)" font-family="monospace, sans-serif" font-size="10">HOME · ARTICLE_DETAIL · LOGIN · SETTINGS · PROFILE · LOGOUT_CONFIRM</text>
    <text x="440" y="282" fill="rgba(255,255,255,0.2)" font-family="monospace, sans-serif" font-size="9">类型安全 · 集中管理 · 重构友好</text>

    <!-- Navigator methods block -->
    <rect x="400" y="302" width="730" height="50" rx="10" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.15)" stroke-width="0.8"/>
    <text x="440" y="322" fill="#a855f7" font-family="monospace, sans-serif" font-size="11" font-weight="600">Navigator</text>
    <text x="510" y="322" fill="rgba(255,255,255,0.5)" font-family="monospace, sans-serif" font-size="10">toArticleDetail(params: ArticleDetailParams)</text>
    <text x="510" y="340" fill="rgba(255,255,255,0.35)" font-family="monospace, sans-serif" font-size="10">toArticleEdit(params?) · toLogin(redirectUrl?) · showLogoutConfirm() · goBack()</text>

    <!-- Arrow: Navigator → HMRouterMgr -->
    <line x1="765" y1="358" x2="765" y2="376" stroke="rgba(124,58,237,0.3)" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

    <!-- Middle layer: HMRouter Core -->
    <rect x="400" y="378" width="730" height="90" rx="10" fill="rgba(233,69,96,0.04)" stroke="rgba(233,69,96,0.15)" stroke-width="0.8"/>
    <text x="440" y="398" fill="#e94560" font-family="monospace, sans-serif" font-size="11" font-weight="600">HMRouterMgr</text>
    <text x="540" y="398" fill="rgba(255,255,255,0.4)" font-family="monospace, sans-serif" font-size="10">push · replace · pop · popToPage · popToRoot</text>

    <rect x="440" y="412" width="150" height="22" rx="11" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.12)" stroke-width="0.8"/>
    <text x="515" y="427" text-anchor="middle" fill="rgba(0,212,255,0.6)" font-family="monospace, sans-serif" font-size="9">@HMRouter 注解</text>

    <rect x="610" y="412" width="150" height="22" rx="11" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.12)" stroke-width="0.8"/>
    <text x="685" y="427" text-anchor="middle" fill="rgba(124,58,237,0.6)" font-family="monospace, sans-serif" font-size="9">路由拦截器</text>

    <rect x="780" y="412" width="150" height="22" rx="11" fill="rgba(75,192,192,0.06)" stroke="rgba(75,192,192,0.12)" stroke-width="0.8"/>
    <text x="855" y="427" text-anchor="middle" fill="rgba(75,192,192,0.6)" font-family="monospace, sans-serif" font-size="9">Dialog 路由</text>

    <rect x="950" y="412" width="150" height="22" rx="11" fill="rgba(233,69,96,0.06)" stroke="rgba(233,69,96,0.12)" stroke-width="0.8"/>
    <text x="1025" y="427" text-anchor="middle" fill="rgba(233,69,96,0.6)" font-family="monospace, sans-serif" font-size="9">自定义转场</text>

    <!-- Arrow: HMRouterMgr → Navigation -->
    <line x1="765" y1="474" x2="765" y2="498" stroke="rgba(0,212,255,0.3)" stroke-width="1.5" marker-end="url(#arrowCyan)"/>

    <!-- Bottom layer: System Navigation -->
    <rect x="400" y="500" width="730" height="60" rx="10" fill="rgba(0,212,255,0.03)" stroke="rgba(0,212,255,0.08)" stroke-width="0.8"/>
    <text x="440" y="522" fill="rgba(0,212,255,0.4)" font-family="monospace, sans-serif" font-size="10">系统 Navigation</text>
    <text x="560" y="522" fill="rgba(255,255,255,0.25)" font-family="monospace, sans-serif" font-size="9">NavPathStack · NavDestination · 转场引擎 · 生命周期</text>

    <rect x="440" y="536" width="660" height="14" rx="4" fill="rgba(0,212,255,0.02)"/>
    <text x="770" y="547" text-anchor="middle" fill="rgba(255,255,255,0.15)" font-family="system-ui, sans-serif" font-size="8">HMRouter 二次封装架构 · 类型安全 · 集中管理 · 模块解耦</text>
  </g>

  <!-- Legend sidebar -->
  <g transform="translate(50, 195)">
    <text x="0" y="0" fill="rgba(255,255,255,0.35)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">架构分层</text>

    <rect x="0" y="14" width="300" height="26" rx="6" fill="rgba(124,58,237,0.06)"/>
    <rect x="6" y="20" width="8" height="14" rx="3" fill="#a855f7" opacity="0.5"/>
    <text x="24" y="32" fill="rgba(255,255,255,0.45)" font-family="system-ui, sans-serif" font-size="10">业务层 — 封装调用</text>

    <rect x="0" y="46" width="300" height="26" rx="6" fill="rgba(233,69,96,0.06)"/>
    <rect x="6" y="52" width="8" height="14" rx="3" fill="#e94560" opacity="0.5"/>
    <text x="24" y="64" fill="rgba(255,255,255,0.45)" font-family="system-ui, sans-serif" font-size="10">路由层 — HMRouter 核心</text>

    <rect x="0" y="78" width="300" height="26" rx="6" fill="rgba(0,212,255,0.06)"/>
    <rect x="6" y="84" width="8" height="14" rx="3" fill="#00d4ff" opacity="0.5"/>
    <text x="24" y="96" fill="rgba(255,255,255,0.45)" font-family="system-ui, sans-serif" font-size="10">系统层 — Navigation</text>

    <!-- Key features -->
    <text x="0" y="130" fill="rgba(255,255,255,0.35)" font-family="system-ui, sans-serif" font-size="11" font-weight="600">核心特性</text>

    <circle cx="14" cy="150" r="4" fill="#00d4ff" opacity="0.5"/>
    <text x="28" y="154" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="10">注解驱动 · 零样板代码</text>

    <circle cx="14" cy="172" r="4" fill="#e94560" opacity="0.5"/>
    <text x="28" y="176" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="10">拦截器链 · 登录·埋点·性能</text>

    <circle cx="14" cy="194" r="4" fill="#7c3aed" opacity="0.5"/>
    <text x="28" y="198" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="10">类型安全 · 编译期参数校验</text>

    <circle cx="14" cy="216" r="4" fill="#4bc0c0" opacity="0.5"/>
    <text x="28" y="220" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="10">Dialog路由 · 弹窗页面</text>
  </g>

  <!-- Footer -->
  <rect x="50" y="580" width="60" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="125" y="584" fill="rgba(255,255,255,0.2)" font-family="system-ui, sans-serif" font-size="12">鸿蒙 V2 组件开发系列 · 第 9 篇（终篇）</text>
</svg>
