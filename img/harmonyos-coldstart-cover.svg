<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#2d1b4e"/>
    </linearGradient>
    <linearGradient id="timerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="33%" style="stop-color:#ffa07a"/>
      <stop offset="66%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#98fb98"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.1" stroke="#4a9eff" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>
  
  <!-- Timer/Stopwatch icon -->
  <g transform="translate(650, 100)" filter="url(#glow)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#4a9eff" stroke-width="3"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#6bb5ff" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#98fb98" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="15" y2="-10" stroke="#ffd700" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#fff"/>
    <!-- Timer marks -->
    <g stroke="#4a9eff" stroke-width="1.5">
      <line x1="0" y1="-42" x2="0" y2="-38"/>
      <line x1="42" y1="0" x2="38" y2="0"/>
      <line x1="0" y1="42" x2="0" y2="38"/>
      <line x1="-42" y1="0" x2="-38" y2="0"/>
    </g>
  </g>
  
  <!-- Speed/rocket icon -->
  <g transform="translate(120, 100)" filter="url(#glow)">
    <path d="M0,-40 L15,-20 L10,0 L20,20 L10,25 L0,35 L-10,25 L-20,20 L-10,0 L-15,-20 Z" 
          fill="none" stroke="#ff6b6b" stroke-width="2"/>
    <path d="M0,-30 L0,25" stroke="#ffa07a" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="-15" r="5" fill="#ffd700" opacity="0.8"/>
  </g>
  
  <!-- Optimization chart -->
  <g transform="translate(350, 280)">
    <!-- Before bar -->
    <rect x="-120" y="-80" width="40" height="80" fill="#ff6b6b" opacity="0.8" rx="2"/>
    <text x="-100" y="-85" fill="#ff6b6b" font-family="Arial" font-size="10" text-anchor="middle">1200ms</text>
    <text x="-100" y="15" fill="#fff" font-family="Arial" font-size="9" text-anchor="middle">Before</text>
    
    <!-- After bar -->
    <rect x="-40" y="-20" width="40" height="20" fill="#98fb98" opacity="0.8" rx="2"/>
    <text x="-20" y="-25" fill="#98fb98" font-family="Arial" font-size="10" text-anchor="middle">300ms</text>
    <text x="-20" y="15" fill="#fff" font-family="Arial" font-size="9" text-anchor="middle">After</text>
    
    <!-- Arrow -->
    <path d="M10,-50 L50,-50" stroke="#ffd700" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="30" y="-55" fill="#ffd700" font-family="Arial" font-size="9" text-anchor="middle">75%</text>
    
    <!-- Improvement label -->
    <rect x="55" y="-65" width="70" height="30" fill="#4a9eff" opacity="0.3" rx="5"/>
    <text x="90" y="-45" fill="#fff" font-family="Arial" font-size="11" text-anchor="middle">优化</text>
  </g>
  
  <!-- Phase indicators -->
  <g transform="translate(350, 120)">
    <rect x="-180" y="0" width="360" height="40" fill="url(#timerGrad)" opacity="0.2" rx="5"/>
    <text x="-150" y="25" fill="#fff" font-family="Arial" font-size="10" opacity="0.8">进程创建</text>
    <text x="-70" y="25" fill="#fff" font-family="Arial" font-size="10" opacity="0.8">应用初始化</text>
    <text x="20" y="25" fill="#fff" font-family="Arial" font-size="10" opacity="0.8">生命周期</text>
    <text x="100" y="25" fill="#fff" font-family="Arial" font-size="10" opacity="0.8">首页绘制</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="50" fill="#fff" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" filter="url(#glow)">
    冷启动优化实战
  </text>
  <text x="400" y="80" fill="#6bb5ff" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">
    从1200ms到300ms
  </text>
  
  <!-- HarmonyOS badge -->
  <rect x="30" y="340" width="120" height="35" fill="#4a9eff" opacity="0.2" rx="17.5"/>
  <text x="90" y="363" fill="#4a9eff" font-family="Arial" font-size="12" text-anchor="middle">HarmonyOS</text>
  
  <!-- Decorative dots -->
  <g fill="#4a9eff" opacity="0.3">
    <circle cx="50" cy="50" r="2"/>
    <circle cx="750" cy="50" r="2"/>
    <circle cx="50" cy="350" r="2"/>
    <circle cx="750" cy="350" r="2"/>
    <circle cx="400" cy="380" r="2"/>
  </g>
</svg>