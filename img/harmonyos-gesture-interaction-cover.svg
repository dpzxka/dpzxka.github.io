<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Hand/touch representation -->
  <!-- Finger touch point -->
  <circle cx="400" cy="280" r="24" fill="#ff6b35" fill-opacity="0.15" stroke="#ff6b35" stroke-width="2" stroke-opacity="0.5" filter="url(#glow)"/>
  <circle cx="400" cy="280" r="8" fill="#ff6b35" fill-opacity="0.6"/>
  
  <!-- Touch ripple -->
  <circle cx="400" cy="280" r="40" fill="none" stroke="#ff6b35" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="400" cy="280" r="60" fill="none" stroke="#ff6b35" stroke-width="0.5" stroke-opacity="0.1"/>

  <!-- Pan gesture arrow -->
  <path d="M 420 280 C 480 260, 540 240, 600 220" fill="none" stroke="#00d2ff" stroke-width="2.5" stroke-opacity="0.7" filter="url(#glow)"/>
  <polygon points="600,220 585,228 588,215" fill="#00d2ff" fill-opacity="0.8"/>
  <text x="510" y="245" fill="#00d2ff" font-family="monospace" font-size="11" opacity="0.6" transform="rotate(-10,510,245)">PanGesture</text>

  <!-- Pinch gesture (two fingers) -->
  <circle cx="300" cy="380" r="16" fill="#7b2ff7" fill-opacity="0.15" stroke="#7b2ff7" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="300" cy="380" r="5" fill="#7b2ff7" fill-opacity="0.5"/>
  <circle cx="500" cy="380" r="16" fill="#7b2ff7" fill-opacity="0.15" stroke="#7b2ff7" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="500" cy="380" r="5" fill="#7b2ff7" fill-opacity="0.5"/>
  <line x1="316" y1="380" x2="484" y2="380" stroke="#7b2ff7" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4,4"/>
  <text x="400" y="415" text-anchor="middle" fill="#7b2ff7" font-family="monospace" font-size="11" opacity="0.6">PinchGesture</text>

  <!-- Rotation gesture -->
  <circle cx="800" cy="280" r="50" fill="none" stroke="#00ff88" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6,4"/>
  <path d="M 830 240 A 50 50 0 0 1 850 280" fill="none" stroke="#00ff88" stroke-width="2" stroke-opacity="0.6"/>
  <polygon points="850,280 840,270 845,285" fill="#00ff88" fill-opacity="0.7"/>
  <circle cx="800" cy="280" r="5" fill="#00ff88" fill-opacity="0.5"/>
  <text x="800" y="345" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="11" opacity="0.6">RotationGesture</text>

  <!-- Tap gesture -->
  <circle cx="200" cy="200" r="20" fill="#00d2ff" fill-opacity="0.1" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="200" cy="200" r="4" fill="#00d2ff" fill-opacity="0.6"/>
  <text x="200" y="240" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="11" opacity="0.6">TapGesture</text>

  <!-- LongPress -->
  <rect x="650" y="350" width="80" height="50" rx="8" fill="#ff6b35" fill-opacity="0.1" stroke="#ff6b35" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="690" cy="375" r="5" fill="#ff6b35" fill-opacity="0.5"/>
  <text x="690" y="420" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="10" opacity="0.5">LongPress</text>

  <!-- Gesture group indicator -->
  <rect x="750" y="150" width="200" height="120" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="6,4"/>
  <text x="850" y="175" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" fill-opacity="0.4">GestureGroup</text>
  <text x="850" y="195" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="10" fill-opacity="0.5">Sequence</text>
  <text x="850" y="215" text-anchor="middle" fill="#7b2ff7" font-family="monospace" font-size="10" fill-opacity="0.5">Parallel</text>
  <text x="850" y="250" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="10" fill-opacity="0.5">JudgeBegin</text>

  <!-- Code icon -->
  <text x="100" y="500" font-family="monospace" font-size="32" fill="#00d2ff" fill-opacity="0.1" font-weight="bold">{...}</text>

  <!-- Title -->
  <text x="80" y="530" fill="#ffffff" font-family="sans-serif" font-size="38" font-weight="700">
    <tspan fill="#ff6b35">Gesture</tspan>
    <tspan fill="#ffffff" fill-opacity="0.9"> &amp; </tspan>
    <tspan fill="#00d2ff">Interaction</tspan>
  </text>
  <text x="80" y="570" fill="#ffffff" font-family="sans-serif" font-size="18" fill-opacity="0.5">鸿蒙高阶自定义UI · 第五篇（完结）</text>

  <!-- API badge -->
  <rect x="1060" y="540" width="100" height="28" rx="14" fill="none" stroke="#ff6b35" stroke-width="1" stroke-opacity="0.3"/>
  <text x="1110" y="559" text-anchor="middle" fill="#ff6b35" font-family="monospace" font-size="11" opacity="0.6">API 12+</text>
</svg>